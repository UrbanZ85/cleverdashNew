openapi: 3.1.0

info:
  title: CleverDash API — 001 Ogrodje in dashboard
  version: 1.0.0
  description: |
    Pogodba funkcionalnosti 001. Vsaka zmožnost je najprej endpoint, šele nato zaslon
    (člen III ustave). Poti so angleške, kebab-case in verzionirane; domenska besedila
    (naslovi zavihkov, sporočila) so slovenska (člen X).

    Enotni izvor: API je na isti domeni kot aplikacija, pod `/api/v1`. CORS ni
    konfiguriran in ni potreben (člen II).

    Glava `Idempotency-Key` je sprejeta na vseh mutacijah razen `POST /auth/refresh` —
    utemeljitev je v plan.md, razdelek Complexity Tracking. `GET /auth/login` in
    `GET /auth/callback` sta preusmeritvi (GET), ne mutaciji, zato vprašanje niti ne nastopi.

    004 (specs/004-keycloak-sso-multiuser): `/auth/*` je Keycloak OIDC (backend-for-frontend)
    namesto prejšnje prijave z e-pošto/geslom — glej specs/004-keycloak-sso-multiuser/research.md
    §9 za utemeljitev, zakaj je ta sprememba tu, ne v ločeni, trajno vzporedni pogodbi.

servers:
  - url: https://app.si/api/v1
    description: Produkcija
  - url: http://localhost:3000/api/v1
    description: Razvoj (dev-server proxy pošlje /api sem)

tags:
  - name: auth
    description: Prijava prek Keycloaka (OIDC), seje, obseg
  - name: tabs
    description: Razrešen register zavihkov
  - name: dashboard
    description: Vreme, napoved, radar
  - name: settings
    description: Lokacija, tema, razporeditev ploščic, stikala zavihkov
  - name: devices
    description: Naprave za potisna obvestila
  - name: api-keys
    description: Ključi za avtomatizacijo
  - name: health
    description: Stanje sistema

security:
  # Vsak vnos je samostojna alternativa (ALI) — dostopni JWT za web/Android ALI X-API-Key
  # za avtomatizacijo (n8n), člen III ustave. Usklajeno z izvedbo: apps/api/src/main.ts
  # namesti oba vratarja (accessTokenGuard, apiKeyGuard) vzporedno pred requireScopes().
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /auth/login:
    get:
      tags: [auth]
      summary: Začni prijavo prek Keycloaka
      description: |
        Preusmeri brskalnik (`302`) na Keycloakov `authorization_endpoint` (Authorization
        Code + PKCE). `redirectTo` pove, kam nazaj v CleverDash preusmeriti po uspešni
        prijavi (FR-002); privzeto `/`.
      security: []
      parameters:
        - name: redirectTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Preusmeritev na Keycloak
          headers:
            Location:
              schema:
                type: string
        '503':
          description: |
            Ponudnika prijave (Keycloak) ni bilo mogoče doseči.

            Na tej poti je klicatelj BRSKALNIK (navigacija, ne XHR), zato je telo stran
            `text/html` in NE `application/problem+json`: dokument JSON bi se v naslovni
            vrstici izrisal kot surovo besedilo, gola napaka `500` pa kot Chromova stran
            "This page isn't working" brez pojasnila (člen VII). Stran imenuje razlog in
            `correlationId` za dnevnik.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Nepričakovana napaka pri začetku prijave; telo je stran `text/html` (glej `503`).
          content:
            text/html:
              schema:
                type: string

  /auth/callback:
    get:
      tags: [auth]
      summary: Povratni klic Keycloaka (redirect_uri)
      description: |
        Izmenja avtorizacijsko kodo za žetone pri Keycloaku, ustvari/najde `User` po
        `keycloakSubject` (FR-003, FR-009), ob prvi prijavi ustvari privzete osebne
        nastavitve (specs/004-keycloak-sso-multiuser/research.md §11), nastavi `httpOnly`
        sejni piškotek in preusmeri (`302`) na `redirectTo` iz `/auth/login`.

        Glave `Idempotency-Key` ta pot ne sprejema — izdaja žetonov (člen III izjema).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Prijava uspela, preusmeritev v CleverDash
        '401':
          description: |
            Koda neveljavna, prijavni tok potekel, ALI je uporabnik pri Keycloaku potrjen, a
            nima nobene prepoznane vloge/skupine (FR-007) — sporočilo ločeno od napačnih
            poverilnic.

            Telo je stran `text/html` in ne `application/problem+json`: klicatelj je
            BRSKALNIK, ki se vrača s Keycloaka (enako kot pri `/auth/login`, člen VII).
          content:
            text/html:
              schema:
                type: string
        '503':
          description: Ponudnika prijave ni bilo mogoče doseči; telo je stran `text/html`.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Nepričakovana napaka pri zaključku prijave; telo je stran `text/html`.
          content:
            text/html:
              schema:
                type: string

  /auth/refresh:
    post:
      tags: [auth]
      summary: Obnovi dostopni žeton
      description: |
        Zavrti Keycloakov `refresh_token` za trenutno sejo (data-model.md, `KeycloakSession`).
        Seja pride iz `httpOnly` piškotka — enako za web IN Android (Capacitorjev WebView
        deli piškotke z lastnimi HTTP klici).

        Glave `Idempotency-Key` ta pot ne sprejema.
      security: []
      responses:
        '200':
          description: Žeton obnovljen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            Seja neveljavna, iztekla ali preklicana pri Keycloaku (FR-005/FR-006) — vključno
            s primerom, ko je Keycloak med preverjanjem nedosegljiv (FR-007).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      tags: [auth]
      summary: Odjava te naprave (in enotna odjava pri Keycloaku)
      description: |
        Prekliče `KeycloakSession` te naprave. Vrne Keycloakov `end_session_endpoint`
        (RP-Initiated Logout) — SPA MORA brskalnik preusmeriti nanj, da se dejansko konča
        tudi Keycloakova seja (FR-004); brez tega naslednji obisk dobi tiho ponovno prijavo
        prek še vedno veljavne Keycloak seje.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lokalna seja preklicana
          content:
            application/json:
              schema:
                type: object
                required: [endSessionUrl]
                properties:
                  endSessionUrl:
                    type: string
                    format: uri

  /auth/me:
    get:
      tags: [auth]
      summary: Podatki o prijavljenem računu
      responses:
        '200':
          description: Račun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions:
    get:
      tags: [auth]
      summary: Seznam aktivnih naprav
      description: Ena vrstica na `KeycloakSession`. Omogoča preklic posamezne naprave.
      responses:
        '200':
          description: Aktivne seje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Prekliči sejo izbrane naprave
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Preklicano
        '404':
          $ref: '#/components/responses/NotFound'

  /tabs:
    get:
      tags: [tabs]
      summary: Razrešen register zavihkov
      description: |
        Definicije so v kodi, `enabled` in `order` se prekrijeta iz nastavitev (FR-002,
        FR-003). Vrne samo zavihke, ki so vklopljeni in za katere ima klicatelj obsege.
        Odjemalec iz tega sestavi meni in usmerjanje.
      responses:
        '200':
          description: Zavihki, urejeni po `order`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TabDefinition'

  /dashboard/weather:
    get:
      tags: [dashboard]
      summary: Trenutno vreme za nastavljeno lokacijo
      description: |
        Podatek pride iz strežniškega predpomnilnika (TTL 600 s). Odjemalec zunanjega vira
        ne kliče nikoli (člen VIII). Ob nedosegljivosti vira vrne `200` z zadnjim znanim
        podatkom in `stale: true` — ne napake (FR-026).
      parameters:
        - name: location
          in: query
          required: false
          description: Ime lokacije; privzeto iz nastavitev
          schema:
            type: string
      responses:
        '200':
          description: Vremenski odčitek, svež ali zadnji znani
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherReading'
        '503':
          description: Podatka še ni bilo nikoli in vir ni dosegljiv
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dashboard/forecast:
    get:
      tags: [dashboard]
      summary: Kratka napoved za naslednjih nekaj ur
      description: |
        Iz istega odgovora vira in istega predpomnilnika kot trenutno vreme, zato ne dodaja
        zunanje odvisnosti (FR-024). Podrobna napoved po dnevih ni v obsegu.
      parameters:
        - name: location
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Napoved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '503':
          description: Podatka še ni bilo nikoli in vir ni dosegljiv
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dashboard/radar:
    get:
      tags: [dashboard]
      summary: Animirana radarska slika padavin
      description: |
        Strežnik streže sliko iz predpomnilnika (TTL 300 s, usklajeno z `max-age=300`
        izvora). Proxy je obvezen: neposredna nešifrirana povezava bi bila na šifrirani
        strani zavrnjena, poleg tega brez proxyja ni zadnje znane slike (FR-025, FR-026).

        Starost slike je v glavah `X-Source-Fetched-At` in `X-Source-Stale`, da jo
        odjemalec prikaže brez dodatne zahteve.
      responses:
        '200':
          description: Slika, sveža ali zadnja znana
          headers:
            X-Source-Fetched-At:
              description: Čas uspešne pridobitve iz izvora (ISO 8601)
              schema:
                type: string
                format: date-time
            X-Source-Stale:
              description: '`true`, kadar je slika starejša od TTL in osvežitev ni uspela'
              schema:
                type: boolean
            X-Source-Attribution:
              description: Navedba vira (FR-027)
              schema:
                type: string
            X-Source-Next-Poll-Seconds:
              description: Priporočen razmik do naslednje osvežitve — glej SourceMeta.nextPollSeconds
              schema:
                type: integer
          content:
            image/gif:
              schema:
                type: string
                format: binary
        '503':
          description: Slike še ni bilo nikoli in vir ni dosegljiv
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dashboard/commute:
    get:
      tags: [dashboard]
      summary: Pot v službo in domov — čas poti, zamuda zaradi prometa in zemljevid
      description: |
        Ploščica "Pot" na nadzorni plošči. Vrne OBE smeri naenkrat: pot domov je ista pot v
        nasprotni smeri, in odjemalec vedno potrebuje obe (obe sta v ploščici hkrati).

        Kraja prideta iz osebnih nastavitev (`Settings.commute`); klicatelj z API ključem
        osebnih nastavitev nima in dobi `configured: false`.

        Čas poti je iz Google Routes API (`directions/v2:computeRoutes`,
        `TRAFFIC_AWARE`), pridobljen IZKLJUČNO prek strežniškega predpomnilnika
        (`COMMUTE_CACHE_SECONDS`, privzeto 300 s — člen VIII; vsaka osvežitev je plačljiva
        zahteva na smer). Ključ `GOOGLE_MAPS_SERVER_KEY` ostane na strežniku (člen IV) in v
        odgovoru ne nastopa.

        **Odgovor je vedno `200`, tudi ko časa poti ni.** Manjkajoč podatek je opisan v
        `travelUnavailable` na tisti smeri, ne kot napaka celotne zahteve: izpad enega vira
        ne sme podreti ploščice (FR-026), uporabnik pa mora videti, KAJ je narobe in kaj
        storiti (člen VII). Zemljevid je odvisen samo od krajev, zato ostane na voljo tudi
        takrat, ko časa poti ni.
      responses:
        '200':
          description: Obe smeri; posamezna je lahko brez časa poti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteResponse'

  /settings:
    get:
      tags: [settings]
      summary: Preberi nastavitve
      responses:
        '200':
          description: Nastavitve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      tags: [settings]
      summary: Posodobi nastavitve
      description: |
        Vključuje lokacijo za vreme, temo, razporeditev in vidnost ploščic (FR-028) ter
        stikala zavihkov (FR-003). Delna posodobitev: navedejo se samo polja, ki se
        spremenijo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Posodobljene nastavitve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /devices:
    get:
      tags: [devices]
      summary: Seznam registriranih naprav
      responses:
        '200':
          description: Naprave
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
    post:
      tags: [devices]
      summary: Registriraj napravo za potisna obvestila
      description: Ponovna registracija istega žetona posodobi obstoječi zapis (FR-030).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Registrirana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'

  /devices/{deviceId}:
    delete:
      tags: [devices]
      summary: Odjavi napravo od obvestil
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Odjavljena
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/test:
    post:
      tags: [devices]
      summary: Pošlji testno obvestilo
      description: |
        Dokaže pot od strežnika do naprave in pravilno odpiranje zaslona ob tapkanju
        (FR-033, SC-006). Obstaja zato, da je P7 samostojno testabilna, ne da bi bilo treba
        čakati na 002.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Če ni podan, gre na vse registrirane naprave
                deepLink:
                  type: string
                  description: Pot v aplikaciji, ki naj se odpre ob tapkanju
      responses:
        '202':
          description: Sprejeto za dostavo
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  removedTokens:
                    type: integer
                    description: Žetoni, ki jih je ponudnik zavrnil in so bili odstranjeni (FR-034)

  /api-keys:
    get:
      tags: [api-keys]
      summary: Seznam ključev za avtomatizacijo
      description: |
        Čistopis ključa se ne vrne nikoli; v seznamu je samo predpona. Zahteva obseg
        `admin` — sistem je enouporabniški (FR-016), zato je to edini smiselni obseg za
        upravljanje ključev.
      responses:
        '200':
          description: Ključi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [api-keys]
      summary: Ustvari ključ z omejenim obsegom
      description: |
        Čistopis se pokaže **samo v tem odgovoru** in ni obnovljiv. Ključ brez obsegov ni
        dovoljen (člen III).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scopes]
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Ustvarjen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Čistopis ključa, prikazan samo enkrat
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api-keys/{keyId}:
    delete:
      tags: [api-keys]
      summary: Prekliči ključ
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Preklican
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [health]
      summary: Stanje sistema
      description: |
        Notranje stanje. Po členu VII **ne zadošča** kot alarm — mrtev proces tega ne
        pokliče. Zunanji dead man's switch je odhodni srčni utrip na `HEALTHCHECK_PING_URL`.
      security: []
      responses:
        '200':
          description: Sistem deluje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Sistem ne deluje pravilno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Kratkoživ dostopni žeton, izdan prek Keycloaka (relay). Veljavnost se pri
        pomembnejših zahtevah preveri v živo pri Keycloaku, s kratkim TTL predpomnjenjem
        (specs/004-keycloak-sso-multiuser/research.md §4) — ne samo z lokalnim preverjanjem
        podpisa/`exp`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Avtentikacija za avtomatizacijo (n8n). Ključ ima omejen obseg; veljaven ključ sam
        po sebi ne pomeni administratorskih pravic (FR-013, člen III).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ponovljen klic z isto vrednostjo vrne prvotni rezultat. Ista vrednost z drugačnim
        telesom zahteve vrne `422`.
      schema:
        type: string
        maxLength: 200

  responses:
    BadRequest:
      description: Neveljavna zahteva
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Ni avtenticiran
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Avtenticiran, a brez zahtevanega obsega
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ni najdeno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457. Sporočilo je v slovenščini in brez tehničnih podrobnosti (FR-026).
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
          description: ID korelacije iz dnevnika, da je prijavljeno napako mogoče najti

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Veljavnost dostopnega žetona v sekundah

    Account:
      type: object
      required: [id, email, displayName, scopes]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastLoginAt:
          type: [string, "null"]
          format: date-time
      description: |
        004: `mustChangePassword` je ODSTRANJEN (FR-017 — ni več lokalnega gesla). Dodan
        `displayName` iz Keycloakovega `name`/`preferred_username` claima.

    DeviceSession:
      type: object
      required: [id, platform, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
        deviceLabel:
          type: string
        platform:
          type: string
          enum: [web, android]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Ali je to seja, iz katere je prišla ta zahteva

    TabDefinition:
      type: object
      description: Vnos registra zavihkov. `title` je slovenski, `id` in `route` sta angleška (člen X).
      required: [id, title, icon, route, order]
      properties:
        id:
          type: string
          example: dashboard
        title:
          type: string
          example: Nadzorna plošča
        icon:
          type: string
        route:
          type: string
          example: /dashboard
        order:
          type: integer
        requiredScopes:
          type: array
          items:
            type: string

    SourceMeta:
      type: object
      description: Skupna ovojnica za vse podatke zunanjega izvora.
      required: [fetchedAt, stale, attribution]
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Čas uspešne pridobitve iz izvora
        ageSeconds:
          type: integer
          description: Starost podatka v sekundah ob tem odgovoru
        stale:
          type: boolean
          description: Podatek je starejši od TTL in osvežitev ni uspela (FR-026)
        nextPollSeconds:
          type: integer
          description: |
            Priporočen razmik do naslednje osvežitve (TTL predpomnilnika na strežniku).
            Odjemalec ta interval prevzame od strežnika namesto lastne konstante — TTL se
            lahko spremeni brez novega builda (FR-022, research.md §8).
        attribution:
          type: object
          description: Navedba vira; funkcionalna zahteva FR-027, ne oblikovna podrobnost
          required: [text, url]
          properties:
            text:
              type: string
              example: 'Vir: ARSO'
            url:
              type: string
              example: https://meteo.arso.gov.si

    WeatherReading:
      type: object
      required: [location, observation, source]
      properties:
        location:
          type: object
          required: [name]
          properties:
            name:
              type: string
            latitude:
              type: [number, "null"]
            longitude:
              type: [number, "null"]
        observation:
          type: object
          description: Polja, ki jih zahteva FR-023. Neuporabljena polja izvora se ne prenašajo.
          properties:
            temperatureC:
              type: [number, "null"]
            humidityPercent:
              type: [number, "null"]
            windSpeed:
              type: [string, "null"]
            windDirection:
              type: [string, "null"]
            skyCondition:
              type: [string, "null"]
              description: Slovensko besedilo izvora, npr. "jasno"
            icon:
              type: [string, "null"]
            measuredAt:
              type: [string, "null"]
              format: date-time
              description: Čas meritve, prikazan v Europe/Ljubljana
        source:
          $ref: '#/components/schemas/SourceMeta'

    ForecastResponse:
      type: object
      required: [location, entries, source]
      properties:
        location:
          type: object
          properties:
            name:
              type: string
        entries:
          type: array
          items:
            type: object
            properties:
              validAt:
                type: string
                format: date-time
              temperatureC:
                type: [number, "null"]
              skyCondition:
                type: [string, "null"]
              icon:
                type: [string, "null"]
        source:
          $ref: '#/components/schemas/SourceMeta'

    TileLayoutEntry:
      type: object
      required: [type, position, visible]
      properties:
        type:
          type: string
          example: weather
        position:
          type: integer
        visible:
          type: boolean
        config:
          type: object
          additionalProperties: true

    Settings:
      type: object
      required: [weather, theme, tiles, tabs, cameraDataSaverEnabled]
      properties:
        weather:
          type: object
          properties:
            locationName:
              type: string
            latitude:
              type: [number, "null"]
            longitude:
              type: [number, "null"]
        theme:
          type: string
          enum: [system, light, dark]
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/TileLayoutEntry'
        tabs:
          type: object
          description: Prekritja registra po id zavihka
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
              order:
                type: integer
        cameraDataSaverEnabled:
          type: boolean
          default: true
          description: |
            003, specs/003-cameras/data-model.md "Nastavitve porabe podatkov" — Story 7.
            Modul kamer to polje samo bere/piše prek te poti, brez lastnega endpointa.
        commute:
          $ref: '#/components/schemas/SettingsCommute'
        updatedAt:
          type: string
          format: date-time

    SettingsCommute:
      type: object
      description: |
        Ploščica "Pot" na nadzorni plošči: DVA KRAJA, ne dva zemljevida. Iz njiju strežnik
        izpelje oboje — čas poti (`GET /dashboard/commute`) in naslov vdelanega zemljevida —
        za obe smeri, ker je pot domov ista pot v nasprotni smeri. Zgoraj v ploščici je
        smer, ki ustreza času dneva; meja je 12:00 po `Europe/Ljubljana` (ista meja kot
        razvrstitev kamer v 003) in ni nastavljiva.

        Vsak kraj potrebuje `address` ALI oba `latitude`/`longitude`. Koordinati imata
        prednost: natančnejši sta in Googlu ni treba geokodirati. Nepopoln kraj je dovoljen
        (vmes med vnašanjem) — ploščica takrat pove, da pot ni nastavljena.

        Delna posodobitev velja PO KRAJU in PO POLJU: `{"commute":{"work":{"label":"…"}}}`
        spremeni samo ime službe. `null` ali prazen niz izprazni polje; prazno ime se vrne
        na privzeto (`Doma` / `Služba`).

        `latitude` in `longitude` je treba navesti SKUPAJ — polovica para je kraj, ki ga ni
        mogoče poslati ne Routes API-ju ne zemljevidu, zato je zavrnjena s `400`.

        `mapHeightPx` in `layout` sta videz ploščice, ne podatek o poti: koliko zemljevida
        kdo potrebuje in ali ima na nadzorni plošči prostor za dva drug ob drugem, je odvisno
        od zaslona. Pri `layout: horizontal` se ploščica samodejno razširi (odjemalec, glej
        `commuteTileWidthPx`).
      properties:
        home:
          $ref: '#/components/schemas/CommutePlace'
        work:
          $ref: '#/components/schemas/CommutePlace'
        mapHeightPx:
          type: integer
          minimum: 100
          maximum: 600
          default: 170
          description: |
            Višina posameznega zemljevida. Vrednost izven mej je zavrnjena s `400` in NE tiho
            obrezana — uporabnik mora vedeti, da vpisano ni bilo shranjeno. `null` pomeni
            "vrni na privzeto".
        layout:
          type: string
          enum: [vertical, horizontal]
          default: vertical
          description: '`vertical` = zemljevida drug pod drugim, `horizontal` = drug ob drugem.'

    CommutePlace:
      type: object
      properties:
        label:
          type: string
          maxLength: 40
          description: Ime za nad zemljevidom; prazno se vrne na privzeto.
        address:
          type: [string, 'null']
          maxLength: 200
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    CommuteTravel:
      type: object
      required: [durationSeconds, staticDurationSeconds, delaySeconds, distanceMeters]
      description: |
        Iz Routes API. `delaySeconds` je `duration - staticDuration`, nikoli negativno —
        hitrejše od običajnega ni "zamuda". Zaradi te razlike se `staticDuration` sploh
        zahteva: samo "40 min" ne pove, ali je to običajno.
      properties:
        durationSeconds:
          type: integer
          description: Trajanje z upoštevanim prometom.
        staticDurationSeconds:
          type: integer
          description: Trajanje brez prometa.
        delaySeconds:
          type: integer
        distanceMeters:
          type: integer

    CommuteLeg:
      type: object
      required: [direction, label, from, to, mapEmbedUrl, travel, travelUnavailable, stale, ageSeconds]
      properties:
        direction:
          type: string
          enum: [to-work, to-home]
        label:
          type: string
          example: V službo
        from:
          type: string
          description: Ime izhodiščnega kraja.
        to:
          type: string
        mapEmbedUrl:
          type: [string, 'null']
          format: uri
          description: |
            Naslov za `<iframe>`, ki ga sestavi strežnik (`domain/map-embed.ts`): uradni
            Maps Embed API, kadar je `GOOGLE_MAPS_EMBED_KEY` nastavljen, sicer klasična
            oblika `output=embed`, ki ključa ne potrebuje. Navadne povezave do poti Google
            v tujem okvirju ne dovoli. `null`, kadar kraja nista dovolj določena.
        travel:
          oneOf:
            - $ref: '#/components/schemas/CommuteTravel'
            - type: 'null'
        travelUnavailable:
          type: [string, 'null']
          enum: [not-configured, no-api-key, no-route, source-unavailable, null]
          description: |
            Prisoten natanko takrat, ko je `travel` `null`. Stanja so ločena, ker ima vsako
            svojo pot ven: kraja nista nastavljena / namestitev nima ključa / med krajema ni
            poti / vir ni dosegljiv in predpomnjenega podatka še nikoli ni bilo.
        stale:
          type: boolean
          description: '`true`, kadar je čas poti zadnji znani in ne svež (FR-026).'
        ageSeconds:
          type: [integer, 'null']

    CommuteResponse:
      type: object
      required: [configured, legs, source]
      properties:
        configured:
          type: boolean
          description: '`true`, kadar sta oba kraja dovolj določena za izračun poti.'
        legs:
          type: array
          description: Vedno dva vnosa, `to-work` in `to-home`.
          items:
            $ref: '#/components/schemas/CommuteLeg'
        source:
          type: object
          required: [nextPollSeconds, attribution]
          properties:
            nextPollSeconds:
              type: integer
              description: |
                `COMMUTE_CACHE_SECONDS`. Pogosteje klicati nima smisla — do izteka TTL
                strežnik vrača isti podatek in zunanjega vira ne kliče (člen VIII).
            attribution:
              type: object
              required: [text, url]
              description: Navedba vira; Googlovi pogoji uporabe jo zahtevajo (kot člen VIII za ARSO).
              properties:
                text:
                  type: string
                url:
                  type: string
                  format: uri

    SettingsUpdate:
      type: object
      description: Delna posodobitev; navedejo se samo polja, ki se spremenijo.
      properties:
        weather:
          type: object
          properties:
            locationName:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        theme:
          type: string
          enum: [system, light, dark]
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/TileLayoutEntry'
        tabs:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
              order:
                type: integer
        cameraDataSaverEnabled:
          type: boolean
        commute:
          $ref: '#/components/schemas/SettingsCommute'

    DeviceRegistration:
      type: object
      required: [pushToken, platform]
      properties:
        pushToken:
          type: string
        platform:
          type: string
          enum: [web, android]
        channels:
          type: array
          items:
            type: string
          default: [system]

    Device:
      type: object
      required: [id, platform, channels, lastSeenAt]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [web, android]
        channels:
          type: array
          items:
            type: string
        lastSeenAt:
          type: string
          format: date-time
        lastDeliveryAt:
          type: [string, "null"]
          format: date-time

    ApiKey:
      type: object
      required: [id, label, keyPrefix, scopes]
      properties:
        id:
          type: string
        label:
          type: string
        keyPrefix:
          type: string
          description: Prvih 8 znakov, da je ključ prepoznaven brez razkritja
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time

    Health:
      type: object
      required: [status, timeZone, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, failing]
        timeZone:
          type: string
          example: Europe/Ljubljana
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, failing]
            configuration:
              type: string
              enum: [ok, failing]
            externalSources:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  ageSeconds:
                    type: integer
                  stale:
                    type: boolean
            heartbeat:
              type: object
              description: Odhodni signal zunanjemu dead man's switchu (člen VII)
              properties:
                configured:
                  type: boolean
                lastSentAt:
                  type: [string, "null"]
                  format: date-time
                lastResult:
                  type: string
                  enum: [ok, failed, skipped]
