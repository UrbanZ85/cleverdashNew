openapi: 3.1.0

info:
  title: CleverDash — Osebni profil, vtičniki in konfigurabilni meni
  version: 1.0.0
  description: |
    REST pogodba za 005. Samostojna pogodba po istem vzorcu kot 002 in 003 — ne podvaja
    poti iz 001 (`/auth/*`, `/devices`, `/api-keys`, `/health`), ki se v produkciji strežejo
    iz istega Express app-a.

    **`GET/PUT /settings` (001) se razširi za eno polje**, `sources` (osebni prepisi
    naslovov zunanjih virov), in **`tiles[]` sprejme novo vrsto `plugin`**. Razširjena dela
    sta tu opisana kot shemi (`SettingsSources`, `PluginTileEntry`), ker se pomen pogodbe
    001 s tem spremeni; poti sama ta datoteka ne podvaja.

    **`GET /tabs` (001) dobi neobvezno polje `detail`** — podnaslov in stanje vira, ki ga
    zavihku prispeva njegov modul (`platform/tabs/extension.ts`). Nova pot je samo
    `GET /tabs/all`.

    ## Avtentikacija (enako kot 001/002/003)

    - **Uporabniška seja** — `Authorization: Bearer <Keycloakov dostopni žeton>`.
    - **Avtomatizacija** — `X-API-Key: <ključ>`. 005 ne uvaja novih obsegov: vtičniki in
      osebne nastavitve obstajajo samo za prijavljenega uporabnika, klicatelj z API ključem
      dobi `400`.

    ## Idempotentnost (enako kot 001/002/003)

    Mutacijski endpointi sprejmejo `Idempotency-Key`.

    ## Izolacija med uporabniki

    Vsak vtičnik pripada natanko enemu uporabniku. Dostop do tujega zapisa vrne **404**, ne
    403 — obstoj tujega zapisa ni podatek, ki bi ga smel izvedeti kdorkoli (isti dogovor kot
    pri kamerah v 003).

servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Vtičniki
    description: Uporabniško definirane ploščice na nadzorni plošči.
  - name: Zavihki
    description: Konfiguracija menija.

paths:
  /dashboard/plugins:
    get:
      tags: [Vtičniki]
      summary: Seznam lastnih vtičnikov
      responses:
        '200':
          description: Seznam, urejen po imenu.
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plugin'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Vtičniki]
      summary: Ustvari vtičnik
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInput'
      responses:
        '201':
          description: Ustvarjen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '400':
          description: |
            Neveljavna definicija. Med drugim: naslov ni `https`, kaže v zasebno omrežje ali
            vsebuje poverilnice; vrsta `json` brez polj ali z neveljavno potjo; podvojeno
            ime; `refreshSeconds` pod 30.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Vtičniki]
      summary: Podrobnosti vtičnika
      responses:
        '200':
          description: Vtičnik.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Vtičniki]
      summary: Posodobi vtičnik
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInput'
      responses:
        '200':
          description: Posodobljen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Vtičniki]
      summary: Izbriši vtičnik
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: |
            Izbrisan. Vnos v `Settings.tiles`, ki kaže na izbrisan vtičnik, se NE pospravi
            samodejno — nadzorna plošča ga ob branju preskoči (isti dogovor kot za neznano
            vrsto ploščice).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/plugins/{pluginId}/data:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Vtičniki]
      summary: Podatek vtičnika, prenesen prek strežnika
      description: |
        Na voljo samo za vrsti `image` in `json`. Člen VIII ustave prepoveduje, da bi
        zunanji vir klical odjemalec — prenos gre skozi strežniški predpomnilnik s
        `refreshSeconds` kot TTL, enako kot `GET /dashboard/radar`.

        Za `link` in `iframe` vrne `400`: ta naslova odpre brskalnik sam.
      responses:
        '200':
          description: |
            Za `json` telo z izluščenimi polji; za `image` surova slika z glavami
            `X-Source-*` (kot pri radarju).
          headers:
            X-Source-Fetched-At:
              schema:
                type: string
                format: date-time
            X-Source-Stale:
              schema:
                type: string
                enum: ['true', 'false']
            X-Source-Next-Poll-Seconds:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginData'
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: Vrsta nima strežniškega prenosa, ali naslov ne prestane preverjanja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Vira še nikoli ni bilo mogoče prenesti (prazen predpomnilnik).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /tabs/all:
    get:
      tags: [Zavihki]
      summary: Vsi zavihki, tudi izklopljeni
      description: |
        Za zaslon "Meni" v nastavitvah. `GET /tabs` (001) izklopljene po definiciji izpusti,
        zato iz njega ni mogoče sestaviti seznama za urejanje: izklopljenega zavihka ne bi
        bilo mogoče najti in vklopiti nazaj.
      responses:
        '200':
          description: Register z razrešenimi osebnimi prekritji.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurableTab'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    PluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Neveljavna zahteva.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Manjkajoča ali neveljavna avtentikacija.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Zapis ne obstaja — ali pa obstaja, a pripada drugemu uporabniku. Razlika namenoma
        ni razvidna.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Sporočilo za uporabnika, v slovenščini.

    PluginKind:
      type: string
      enum: [link, iframe, image, json]
      description: |
        - `link` — kartica z gumbom, ki odpre naslov;
        - `iframe` — tuja stran, vdelana v ploščico;
        - `image` — zunanja slika, ki se sama osvežuje;
        - `json` — iz odgovora JSON izpiše izbrana polja.

    PluginField:
      type: object
      required: [label, path]
      properties:
        label:
          type: string
          maxLength: 40
        path:
          type: string
          maxLength: 200
          description: Pikčasta pot, npr. `observation.t` ali `list.0.main.temp`.
        unit:
          type: [string, 'null']
          maxLength: 16

    PluginInput:
      type: object
      required: [name, kind, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        icon:
          type: string
          description: Ime ikone iz registra na odjemalcu (`core/icons/register-icons.ts`).
        kind:
          $ref: '#/components/schemas/PluginKind'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Samo `https`, brez poverilnic, brez zasebnih/lokalnih naslovov — strežnik ta
            naslov pri vrstah `image` in `json` obišče sam (glej `domain/outbound-url.ts`).
        openInNewTab:
          type: boolean
          default: true
          description: Samo za `link`.
        description:
          type: [string, 'null']
          maxLength: 200
          description: Samo za `link`.
        heightPx:
          type: integer
          minimum: 80
          maximum: 1200
          default: 320
          description: Samo za `iframe`.
        widthPx:
          type: integer
          minimum: 200
          maximum: 1600
          default: 320
          description: |
            Širina ploščice na nadzorni plošči, v slikovnih točkah. Odjemalec jo na ožjem
            zaslonu zoži na razpoložljivo širino — vrednost je zgornja meja, ne zagotovilo.
            Dokumenti izpred prehoda na slikovne točke so imeli namesto tega `columnSpan`
            (1–3 stolpce); strežnik jih ob branju preslika v približno enako širino.
        refreshSeconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 300
          description: |
            Samo za `image` in `json`. Spodnja meja 30 s je namerna (člen VIII) — vtičnik ne
            sme postati orodje za obstreljevanje tujega vira.
        alt:
          type: [string, 'null']
          maxLength: 200
          description: Samo za `image`.
        fields:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/PluginField'
          description: Samo za `json`; vsaj eno polje je obvezno.

    Plugin:
      allOf:
        - $ref: '#/components/schemas/PluginInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PluginData:
      type: object
      required: [fields, source]
      properties:
        fields:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value:
                type: [string, 'null']
                description: |
                  `null` pomeni, da polja v odgovoru NI (pot je najbrž napačna). Prazna
                  vrednost v odgovoru se izpiše kot pomišljaj — to je nekaj drugega.
        source:
          type: object
          properties:
            fetchedAt:
              type: string
              format: date-time
            ageSeconds:
              type: integer
            stale:
              type: boolean
            nextPollSeconds:
              type: integer

    TabDetail:
      type: object
      description: |
        Dodatek, ki ga zavihku prispeva njegov MODUL prek `platform/tabs/extension.ts` —
        `platform/tabs` modula ne pozna po imenu (člen I). Pojavi se tudi v `GET /tabs`.
      properties:
        subtitle:
          type: string
          description: Ena vrstica pod naslovom, npr. `Agenda — e-racuni.com`.
        status:
          type: string
          enum: [ok, warning, danger]
        statusLabel:
          type: string
          description: Besedilo značke, npr. `seji poteče`.

    ConfigurableTab:
      type: object
      required: [id, title, icon, route, order, enabled, undisableable]
      properties:
        id:
          type: string
        title:
          type: string
        icon:
          type: string
        route:
          type: string
        order:
          type: integer
        enabled:
          type: boolean
        undisableable:
          type: boolean
          description: |
            `true` za zavihke, katerih izklop bi uporabnika zaklenil iz aplikacije —
            `PUT /settings` tak poskus zavrne s `400`. Trenutno samo `settings`.

    SettingsSources:
      type: object
      description: |
        Razširitev `Settings` iz 001. Osebni prepisi naslovov zunanjih virov; `null` ali
        prazen niz pomeni "velja sistemski privzetek iz `.env`". Strežnik razreši
        `sources.* ?? env.*`.
      properties:
        weatherUrl:
          type: [string, 'null']
          format: uri
        radarUrl:
          type: [string, 'null']
          format: uri
        webcamBaseUrl:
          type: [string, 'null']
          format: uri

    PluginTileEntry:
      type: object
      description: |
        Razširitev `Settings.tiles[]` iz 001. Razporeditev vtičnikov ostane v `tiles`, da
        ima vrstni red en sam vir resnice; polje `config` je za to obstajalo že od 001.
      required: [type, position, config]
      properties:
        type:
          type: string
          const: plugin
        position:
          type: integer
        visible:
          type: boolean
          default: true
        config:
          type: object
          required: [pluginId]
          properties:
            pluginId:
              type: string
