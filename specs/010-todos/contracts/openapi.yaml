openapi: 3.1.0

info:
  title: CleverDash — Opravila
  version: 1.0.0
  description: |
    REST pogodba za zavihek Opravila (010). Samostojna pogodba pod `/todos` in `/users`, po
    istem vzorcu kot 003, 007 in 009 — ne podvaja poti iz 001 (`/auth/*`, `/devices`,
    `/api-keys`, `/settings`, `/health`), ki se v produkciji strežejo iz istega Express app-a.

    ## Prva pogodba z zapisom, ki ga bere več kot en uporabnik

    Vseh devet prejšnjih modulov je strogo osebnih: zapis nosi `userId` in tuj zapis vrne
    `404`. Tu je lastništvo (`ownerId`) in vidnost (`members`) dvoje. Posledica za pogodbo je
    normativna in ni implementacijska podrobnost:

    - **`404`** — klicatelj ni ne lastnik ne soudeleženec. Obstoj tujega seznama ni podatek, ki
      bi ga API razkril (vzorec 004).
    - **`403`** — klicatelj JE soudeleženec, a njegova stopnja tega dejanja ne dovoli. Tu `404`
      ne bi skril ničesar (seznam ima v svojem prikazu), samo zavajal bi.
    - **`409`** — seznam je zaklenjen, ali pa je dosegel zgornjo mejo. Oboje je STANJE zapisa,
      ki mine, ne lastnost klicatelja. Odjemalec se mora na `403` in `409` odzvati različno:
      pri `403` kontrolo skrije, pri `409` jo pusti in pokaže ključavnico.

    ## Tri stopnje soudeleženca

    | stopnja | sme |
    |---|---|
    | `view` | brati |
    | `check` | brati, preklapljati `done` |
    | `edit` | vse z opravili: dodajati, urejati, brisati, preurejati, čistiti opravljena |

    IZKLJUČNO lastnik sme: izbrisati seznam, ga preimenovati, zakleniti/odkleniti in spremeniti,
    komu je deljen. Nobena stopnja tega ne podeli. Zaklenjen seznam soudeležencu ne dovoli
    NIČESAR, niti preklopa `done`; lastnika zaklep ne omejuje.

    ## Avtentikacija (enako kot 001/002/003)

    - **Uporabniška seja** — `Authorization: Bearer <access JWT>`.
    - **Avtomatizacija** — `X-API-Key: <ključ>`.

    Novi obsegi: `todos:read`, `todos:write` in — ločeno — **`todos:share`**. Deljenje ima
    lasten obseg, ker je edina operacija v modulu, ki zadene človeka, ki ni klicatelj; člen III
    postavlja API ključ za prvorazrednega odjemalca, zato mora biti obseg njegovega UČINKA
    nastavljiv. Z enim samim obsegom za pisanje bi »n8n lahko doda opravilo« nujno pomenilo
    tudi »n8n lahko seznam podari«. API ključ ne obide nobene omejitve (FR-096).

    ## Idempotentnost — brez izjem (člen III)

    **Vsak** mutacijski endpoint v tej pogodbi sprejme `Idempotency-Key`. Ta modul ne uporablja
    izjeme za izdajo žetonov, ker žetonov ne izdaja, in nima binarnih teles.

    **Zato tudi noben `DELETE` ne vrača `204`.** To ni okrasje: hramba idempotence zajame
    odgovor tako, da ovije `res.json`, in odgovor brez telesa skoznjo ne gre — ponovljen
    `DELETE` z istim ključem bi se izvedel ZNOVA in vrnil `404`. Avtomatizacija, ki brisanje
    ponovi po časovni omejitvi, bi zabeležila lažno napako. Vsi `DELETE` zato vračajo `200` s
    telesom.

    ## Preurejanje pošlje cel vrstni red

    `PUT /todos/lists/{listId}/order` sprejme celoten `taskIds`, ne ukaza »premakni gor«.
    Ponovljen relativni premik bi opravilo premaknil dvakrat, česar obljuba `Idempotency-Key`
    ne prenese. Ponovljen `PUT /order` je no-op.

    ## Kar strežnik izračuna in odjemalec ne

    Odgovori vsebujejo `capabilities` (kaj ta klicatelj na tem seznamu sme), `dueState`
    (`overdue`/`today`/`tomorrow`/`later`, računano v coni `Europe/Ljubljana`) in `tasks`, ki so
    **že razvrščena** za prikaz. Odjemalec ne odloča o ničemer in po preklopu `done` ne ugiba
    novega vrstnega reda (člen XI).

servers:
  - url: /api/v1
    description: Isti izvor kot SPA (člen II).

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Seznami
    description: Seznami opravil — ustvarjanje, branje, preimenovanje, zaklep, izbris.
  - name: Opravila
    description: Opravila znotraj seznama — dodajanje, preklop, urejanje, vrstni red, čiščenje.
  - name: Deljenje
    description: Soudeleženci in njihove stopnje. Skoraj vse samo lastnik.
  - name: Nadzorna plošča
    description: Poceni branje za ploščico.
  - name: Uporabniki
    description: Imenik za izbiro osebe. Ni del modula opravil — živi v skupni plasti.

paths:
  /todos/lists:
    get:
      tags: [Seznami]
      summary: Seznami, do katerih imam dostop
      description: |
        Lastni in deljeni skupaj, brez ločnice — razlika je v pravicah, ne v tem, kje seznam
        živi (FR-005). Urejeno po `updatedAt` padajoče. **Brez opravil**; za ta je
        `GET /todos/lists/{listId}` ali `includeTasks`.
      operationId: listTodoLists
      parameters:
        - name: includeTasks
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Vrni tudi `tasks` pri vsakem seznamu. Za prvi izris zavihka, da preklop med čipi ne
            zahteva novega klica.
      responses:
        '200':
          description: Seznami in veljavne meje.
          content:
            application/json:
              schema:
                type: object
                required: [lists, limits]
                properties:
                  lists:
                    type: array
                    items: { $ref: '#/components/schemas/TodoList' }
                  limits: { $ref: '#/components/schemas/Limits' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Seznami]
      summary: Ustvari seznam
      operationId: createTodoList
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Seznam je ustvarjen. Klicatelj je njegov lastnik.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Doseženo največje število seznamov na uporabnika.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/current:
    get:
      tags: [Nadzorna plošča]
      summary: Seznam za ploščico
      description: |
        Vrne pripeti seznam, sicer nazadnje spremenjenega, ki ga klicatelj sme videti — vedno
        **z opravili**, v enem branju.

        Pripetost hrani odjemalec v `Settings.tiles[].config.listId` in jo pošlje kot `listId`;
        strežnik o njej ne ve ničesar in je ne shranjuje.

        `fallback: true` pomeni, da pripetega seznama ni več ali je bil dostop odvzet, zato je
        vrnjen nazadnje spremenjeni. **Ta primer ni napaka**: ploščica ne sme podreti nadzorne
        plošče (FR-085). `list: null` pomeni, da klicatelj še nima nobenega seznama.
      operationId: getCurrentTodoList
      parameters:
        - name: listId
          in: query
          required: false
          schema: { type: string }
          description: Pripeti seznam, če ga uporabnik ima.
      responses:
        '200':
          description: Seznam za prikaz, ali `null`.
          content:
            application/json:
              schema:
                type: object
                required: [list, fallback, nextPollSeconds]
                properties:
                  list:
                    oneOf:
                      - { $ref: '#/components/schemas/TodoList' }
                      - { type: 'null' }
                  fallback:
                    type: boolean
                    description: Pripeti seznam ni bil dosegljiv; vrnjen je nazadnje spremenjeni.
                  nextPollSeconds:
                    type: integer
                    description: |
                      Čez koliko sekund naj odjemalec vpraša znova. Pove ga **strežnik** (60 za
                      osebni seznam, 30 za deljen); odjemalec intervala NE SME imeti kot
                      konstante (FR-087, člen VIII).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /todos/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Seznami]
      summary: En seznam z opravili
      operationId: getTodoList
      responses:
        '200':
          description: Seznam. `tasks` so že razvrščena za prikaz.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }

    patch:
      tags: [Seznami]
      summary: Preimenuj ali zakleni seznam
      description: |
        **Samo lastnik.** Nobena stopnja soudeleženca tega ne podeli (FR-045).

        Izpuščeno polje pomeni »ne spreminjaj« (isti dogovor kot `PUT /settings` in
        `PATCH /notes/{id}`).
      operationId: updateTodoList
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                locked: { type: boolean }
      responses:
        '200':
          description: Posodobljen seznam.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

    delete:
      tags: [Seznami]
      summary: Izbriši seznam
      description: |
        **Samo lastnik**, tudi kadar je seznam zaklenjen (zaklep omejuje soudeležence, ne
        lastnika). Odstrani opravila **in** vsa članstva.

        Vrne `200` s telesom, **ne** `204` — glej opis idempotentnosti zgoraj.
      operationId: deleteTodoList
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Izbrisano.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/seen:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Deljenje]
      summary: Označi deljen seznam kot viden
      description: |
        Pobriše oznako »novo« za klicatelja (`members[].seenAt`). Deluje tudi na zaklenjenem
        seznamu: to ni sprememba vsebine, ampak potrditev, da sem obvestilo videl.

        Za lastnika je no-op — lastnik svojega seznama ni nikoli »nov«.
      operationId: markTodoListSeen
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Označeno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/MemberUserId'
    put:
      tags: [Deljenje]
      summary: Deli seznam ali spremeni stopnjo
      description: |
        **Samo lastnik**, in zahteva obseg `todos:share` (ne `todos:write`).

        `201` pomeni, da je soudeleženec nov — takrat je seznam zanj označen kot nov, dokler ga
        prvič ne odpre. `200` pomeni spremembo stopnje obstoječemu; ta oznake ne postavi znova.

        Lastnika ni mogoče dodati med soudeležence in isti uporabnik ne more nastopiti dvakrat
        (FR-048).
      operationId: putTodoListMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/MemberRole' }
      responses:
        '200':
          description: Stopnja obstoječega soudeleženca je spremenjena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '201':
          description: Soudeleženec je dodan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400':
          description: |
            Neveljavna stopnja, ali poskus dodati lastnika med soudeležence.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404':
          description: |
            Seznam ne obstaja ali ni klicateljev — **ali pa navedeni uporabnik ne obstaja
            oziroma se v CleverDash še ni nikoli prijavil** (FR-070).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Doseženo največje število soudeležencev na seznamu.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

    delete:
      tags: [Deljenje]
      summary: Odvzemi dostop ali zapusti seznam
      description: |
        Dve različni dejanji na isti poti, ločeni po tem, kdo kliče:

        - **lastnik** odvzame dostop komur koli — zahteva obseg `todos:share`;
        - **soudeleženec** odstrani samega sebe (`userId` je njegov) — zahteva `todos:write`
          in je dovoljeno **tudi kadar je seznam zaklenjen**: zaklep omejuje spremembe *v*
          seznamu, ne pripadnosti tujim podatkom (FR-047).

        Lastnik sebe ne more odstraniti — lahko samo izbriše seznam.

        Vrne `200` s telesom, ne `204`.
      operationId: deleteTodoListMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: |
            Dostop je odvzet. Kadar je klicatelj odstranil samega sebe, je `list` `null` — do
            seznama nima več dostopa in ga ne sme več videti.
          content:
            application/json:
              schema:
                type: object
                required: [removed, list]
                properties:
                  removed: { type: boolean, const: true }
                  list:
                    oneOf:
                      - { $ref: '#/components/schemas/TodoList' }
                      - { type: 'null' }
        # Lastnikov odhod s SVOJEGA seznama da 403, ne 400.
        #
        # Prvotno je bilo tu 400 ("zahteva brez pomena"), a bi to zahtevalo posebno vejo v
        # usmerjevalniku: lastniku zmožnost `leaveList` odreka ISTA matrika kot vsako drugo
        # pomanjkanje pravice (modules/todos/domain/capabilities.ts), enoten razsodnik pa
        # obstaja prav zato, da posebnih vej ni. Sporočilo pove, kaj naj naredi namesto tega:
        # seznam lahko izbriše.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Opravila]
      summary: Dodaj eno ali več opravil
      description: |
        Zahteva stopnjo `edit` ali lastništvo.

        `titles` je seznam, ker prilepljeno večvrstično besedilo ustvari po eno opravilo na
        vrstico, ne enega s prelomi (FR-013). Hitri vnos pošlje seznam z enim elementom.

        Besedilo se pred shranjevanjem očisti (robni presledki, zliti notranji vključno s
        prelomi vrstic, odstranjeni krmilni znaki). Vnos, od katerega po čiščenju ne ostane
        nič, je zavrnjen — nikoli tiho preskočen.
      operationId: createTodoTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titles]
              properties:
                titles:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 200 }
                dueDate:
                  oneOf:
                    - { type: string, format: date }
                    - { type: 'null' }
                  description: |
                    Neobvezen skupen rok za vsa opravila iz te zahteve. Koledarski dan
                    (`YYYY-MM-DD`), ne trenutek; strežnik ga razume v coni `Europe/Ljubljana`.
      responses:
        '201':
          description: Opravila so dodana. Vrnjeno je novo stanje celega seznama.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '409': { $ref: '#/components/responses/LockedOrFull' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/tasks/clear-completed:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Opravila]
      summary: Počisti opravljena
      description: |
        Zahteva stopnjo `edit` ali lastništvo. Neodkljukanih se **ne** dotakne.

        Izbor se opravi ob zapisu, ne iz prikaza odjemalca: kar je kdo medtem odkljukal, se
        odstrani z ostalimi (FR-018). Ponovljen klic na že počiščenem seznamu je no-op z
        `removed: 0`.
      operationId: clearCompletedTodoTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Odstranjeno.
          content:
            application/json:
              schema:
                type: object
                required: [removed, list]
                properties:
                  removed: { type: integer, minimum: 0 }
                  list: { $ref: '#/components/schemas/TodoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '409': { $ref: '#/components/responses/LockedOrFull' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/order:
    parameters:
      - $ref: '#/components/parameters/ListId'
    put:
      tags: [Opravila]
      summary: Nastavi vrstni red neodkljukanih opravil
      description: |
        Zahteva stopnjo `edit` ali lastništvo.

        Sprejme **cel** vrstni red, ne relativnega premika — ponovljen »premakni gor« bi
        opravilo premaknil dvakrat, ponovljen `PUT /order` pa je no-op.

        Navesti je treba neodkljukana opravila; odkljukanih se to ne dotakne, ker so vedno pod
        črto in razvrščena po času odkljukanja. Neznan ali odkljukan `taskId` v seznamu se
        preskoči, opravilo, ki ga je kdo medtem dodal in ga v seznamu ni, pa obdrži svoj
        položaj in se ne izgubi (FR-026).
      operationId: reorderTodoTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  items: { type: string }
                  maxItems: 200
      responses:
        '200':
          description: Nov vrstni red.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
        '409': { $ref: '#/components/responses/LockedOrFull' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /todos/lists/{listId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Opravila]
      summary: Preklopi, preimenuj ali datiraj opravilo
      description: |
        **Zahtevana stopnja je odvisna od polj v telesu** — to je edini razlog, da stopnja
        `check` sploh obstaja:

        - `done` → zadošča stopnja `check`;
        - `title` ali `dueDate` → zahteva stopnjo `edit`.

        Telo z več polji zahteva najvišjo od potrebnih stopenj.

        Izpuščeno polje pomeni »ne spreminjaj«. `dueDate: null` pomeni »odstrani rok« in se od
        izpuščenega razlikuje.

        Ob `done: true` strežnik zapiše tudi čas in avtorja odkljukanja; ob `done: false` ju
        počisti. Oboje se zgodi v istem zapisu — opravilo ne more ostati odkljukano brez
        podatka, kdaj.

        Preklop je namenoma **posamičen** in ne masoven: to je najmanjša atomarna enota, in
        dva uporabnika, ki hkrati preklopita **različni** opravili istega seznama, oba uspeta
        (FR-027).
      operationId: updateTodoTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                done: { type: boolean }
                title: { type: string, minLength: 1, maxLength: 200 }
                dueDate:
                  oneOf:
                    - { type: string, format: date }
                    - { type: 'null' }
      responses:
        '200':
          description: Novo stanje celega seznama, z že preračunanim vrstnim redom.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404':
          description: Seznam ali opravilo ne obstaja — ali seznam ni klicateljev.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/LockedOrFull' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

    delete:
      tags: [Opravila]
      summary: Izbriši opravilo
      description: |
        Zahteva stopnjo `edit` ali lastništvo. Vrne `200` s telesom, ne `204`.
      operationId: deleteTodoTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Izbrisano; vrnjeno je novo stanje seznama.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, list]
                properties:
                  deleted: { type: boolean, const: true }
                  list: { $ref: '#/components/schemas/TodoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '404':
          description: Seznam ali opravilo ne obstaja — ali seznam ni klicateljev.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/LockedOrFull' }
        '422': { $ref: '#/components/responses/IdempotencyMismatch' }

  /users:
    get:
      tags: [Uporabniki]
      summary: Imenik uporabnikov za izbiro osebe
      description: |
        **Ta pot NI del modula opravil.** Živi v skupni plasti (`platform/users/`), ker imenik
        uporabnikov ni pojem opravil in ker mora preživeti odstranitev katerega koli modula
        (člen I). Zato tudi ne zahteva obsega `todos:*` — zadošča katerakoli veljavna
        avtentikacija, enako kot pri `/tabs` in `/devices`.

        Vsebuje IZKLJUČNO uporabnike, ki so se v CleverDash **že vsaj enkrat prijavili**:
        ponuditi človeka, ki se ne more prijaviti, je obljuba, ki je ni mogoče izpolniti
        (FR-070). Uporabnik, ki ima račun pri ponudniku identitete, a aplikacije še ni odprl,
        se v imeniku pojavi takoj po svoji prvi prijavi.

        **E-pošta se vrne izključno zamaskirana** (`emailHint`, npr. `j…k@agenda.si`).
        Razločevanje soimenjakov celega naslova ne potrebuje, izročitev celega pa bi vsakemu
        prijavljenemu uporabniku dala uporaben seznam naslovov cele namestitve (FR-072).
        Odgovor NE vsebuje identifikatorja pri ponudniku identitete, obsegov pravic ne
        notranjih zastavic stanja (FR-073).
      operationId: listDirectoryUsers
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Filtrira po imenu za prikaz.
        - name: excludeSelf
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Izpusti klicatelja — v izbirniku za deljenje sebe ni smiselno ponujati.
      responses:
        '200':
          description: Imenik, urejen po imenu s slovenskim primerjalnikom.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    MemberUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: Identifikator uporabnika iz `GET /users`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: |
        Ponovljena zahteva z istim ključem, isto potjo in istim telesom vrne prvotni odgovor
        (člen III). Ta modul **nima nobene izjeme**: glavo sprejmejo vse mutacije, vključno z
        vsemi `DELETE` — prav zato ti vračajo `200` s telesom in ne `204`.

  responses:
    BadRequest:
      description: Telo zahteve ne ustreza pogodbi.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Manjka ali je neveljavna avtentikacija.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Manjka zahtevani obseg (`todos:read` / `todos:write` / `todos:share`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenRole:
      description: |
        Klicatelj **je** soudeleženec ali ima obseg, a njegova stopnja tega dejanja ne dovoli —
        na primer `view`, ki poskuša odkljukati, ali soudeleženec, ki poskuša izbrisati seznam.

        Namenoma `403` in ne `404`: hišno pravilo varuje obstoj **zapisa**, ne obstoja
        **pravice**. Klicatelj seznam že vidi v svojem prikazu, zato `404` ne bi skril ničesar,
        pač pa bi popravljivo pomanjkanje pravice spremenil v videz okvare (člen VII).

        Odjemalec naj ob tem odgovoru kontrolo za tega uporabnika **skrije** — za razliko od
        `409`, kjer jo pusti.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundOrNotYours:
      description: |
        Seznama ni — ali pa klicatelj ni ne njegov lastnik ne soudeleženec. Namenoma isti
        odgovor: obstoj tujega seznama ni podatek, ki bi ga API razkril (vzorec 004).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LockedOrFull:
      description: |
        Seznam je **zaklenjen** (in klicatelj ni lastnik), ali pa je dosegel zgornjo mejo
        opravil.

        `409` in ne `403`, ker gre za **stanje zapisa**, ne za lastnost klicatelja: ključavnico
        lastnik odklene z enim klikom, poln seznam pa se izprazni s čiščenjem opravljenih —
        ista zahteva bo takrat uspela.

        Odjemalec naj kontrolo **pusti** in pokaže vzrok (ključavnico oziroma polnost). Vzrok
        je razviden iz `title` in `detail`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyMismatch:
      description: Isti `Idempotency-Key` je bil že uporabljen z drugačnim telesom zahteve.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457. `detail` je namenjen uporabniku; tehnični vzrok je samo v dnevniku pod `correlationId`.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }

    MemberRole:
      type: string
      enum: [view, check, edit]
      description: |
        `view` bere; `check` sme dodatno preklapljati `done`; `edit` sme vse z opravili.
        Lastništva ni v tem naboru — lastnik ni stopnja, ampak lastnost seznama.

    TodoRole:
      type: string
      enum: [owner, view, check, edit]
      description: Vloga klicatelja na tem seznamu.

    DueState:
      type: string
      enum: [overdue, today, tomorrow, later]
      description: |
        Izračunano na strežniku glede na **koledarski dan** v coni `Europe/Ljubljana`, ne po
        razliki v milisekundah. Ni shranjeno — shranjeno bi bilo naslednji dan napačno.

    Capabilities:
      type: object
      description: |
        Kaj ta klicatelj na tem seznamu sme, v tem trenutku in pri tem stanju ključavnice.
        Odjemalec iz tega izriše vmesnik in ničesar ne ugiba.
      required:
        [readList, toggleTask, writeTasks, reorderTasks, clearCompleted,
         renameList, deleteList, manageSharing, toggleLock, leaveList]
      properties:
        readList: { type: boolean }
        toggleTask: { type: boolean }
        writeTasks: { type: boolean }
        reorderTasks: { type: boolean }
        clearCompleted: { type: boolean }
        renameList: { type: boolean }
        deleteList: { type: boolean }
        manageSharing: { type: boolean }
        toggleLock: { type: boolean }
        leaveList: { type: boolean }

    UserSummary:
      type: object
      description: |
        Predstavitev osebe za prikaz. Namenoma majhna: nič, kar ni potrebno za izbiro in
        prepoznavo, ni tu.
      required: [id, displayName, initials]
      properties:
        id: { type: string }
        displayName: { type: string }
        initials:
          type: string
          maxLength: 2
          description: Za kroglico ob imenu. Izpeljano, ne shranjeno.
        emailHint:
          type: string
          description: |
            Zamaskirana e-pošta (`j…k@agenda.si`), IZKLJUČNO za razločevanje soimenjakov. Cel
            naslov se ne vrne nikoli. Pri prikazu **že dodanih** soudeležencev tega polja ni —
            tam zadoščata ime in začetnice (FR-074).

    TodoMember:
      type: object
      required: [user, role, addedAt]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        role: { $ref: '#/components/schemas/MemberRole' }
        addedAt: { type: string, format: date-time }

    TodoTask:
      type: object
      required: [id, title, done, dueDate, dueState, doneAt, doneBy, createdAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        done: { type: boolean }
        dueDate:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
          description: '`null` pomeni BREZ ROKA, ne »danes«.'
        dueState:
          oneOf:
            - { $ref: '#/components/schemas/DueState' }
            - { type: 'null' }
          description: '`null`, kadar opravilo roka nima.'
        doneAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        doneBy:
          oneOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
          description: Kdo je odkljukal. Smiselno pri deljenem seznamu; pri osebnem vedno klicatelj.
        createdAt: { type: string, format: date-time }

    TodoList:
      type: object
      required:
        [id, title, locked, owner, role, capabilities, members,
         taskCount, openCount, nextDueDate, isNew, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 100 }
        locked: { type: boolean }
        owner: { $ref: '#/components/schemas/UserSummary' }
        role: { $ref: '#/components/schemas/TodoRole' }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        members:
          type: array
          items: { $ref: '#/components/schemas/TodoMember' }
        tasks:
          type: array
          description: |
            **Že razvrščena za prikaz**: neodkljukana po ročnem vrstnem redu, nato odkljukana
            po času odkljukanja padajoče. Odjemalec vrstnega reda ne računa.

            Izpuščeno pri `GET /todos/lists` brez `includeTasks`.
          items: { $ref: '#/components/schemas/TodoTask' }
        taskCount: { type: integer, minimum: 0 }
        openCount:
          type: integer
          minimum: 0
          description: Neodkljukana. Izpeljano, ne shranjeno.
        nextDueDate:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
          description: Najzgodnejši rok med neodkljukanimi opravili.
        lastModifiedBy:
          oneOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
          description: Kdo je nazadnje karkoli spremenil — za »spremenila Ana · 10:24«.
        isNew:
          type: boolean
          description: |
            Seznam je bil s klicateljem deljen in ga ta še ni odprl. Nadomešča potisno
            obvestilo (FR-007). Za lastnika vedno `false`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Limits:
      type: object
      description: |
        Veljavne meje, da odjemalec sporoči napako, preden pošlje zahtevo, ki bo zavrnjena.
        Potujejo z odgovorom in ne po svojem endpointu — so konstante, ne stanje.
      required:
        [maxListTitleLength, maxTaskTitleLength, maxTasksPerList,
         maxTasksPerRequest, maxListsPerUser, maxMembersPerList]
      properties:
        maxListTitleLength: { type: integer }
        maxTaskTitleLength: { type: integer }
        maxTasksPerList: { type: integer }
        maxTasksPerRequest: { type: integer }
        maxListsPerUser: { type: integer }
        maxMembersPerList: { type: integer }
