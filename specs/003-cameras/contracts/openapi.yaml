openapi: 3.1.0

info:
  title: CleverDash — Kamere
  version: 1.0.0
  description: |
    REST pogodba za zavihek kamer (003). Samostojna pogodba pod `/cameras`, po istem vzorcu
    kot 002 — ne podvaja poti iz 001 (`/auth/*`, `/devices`, `/api-keys`, `/settings`,
    `/health`), ki se v produkciji strežejo iz istega Express app-a.

    **`GET /settings` (001) se razširi za eno polje**, `cameraDataSaverEnabled` — glej
    `data-model.md`, "Nastavitve porabe podatkov". Ta datoteka ga zato ne podvaja kot
    ločeno pot.

    ## Avtentikacija (enako kot 001/002)

    - **Uporabniška seja** — `Authorization: Bearer <access JWT>`.
    - **Avtomatizacija** — `X-API-Key: <ključ>`. Novi obsegi za 003: `cameras:read`,
      `cameras:write`.

    ## Idempotentnost (enako kot 001/002)

    Mutacijski endpointi (`POST`, `PUT`, `PATCH`, `DELETE`) sprejmejo `Idempotency-Key`.
    Ponovljena zahteva z istim ključem, isto potjo in istim telesom vrne prvotni odgovor
    (člen III ustave).

    ## Omejitev zveznih tokov skozi proxy (research.md §4)

    `GET /cameras/{id}/stream` je preprost pass-through proxy za `mjpeg`/`hls` vire, ki
    morajo iti skozi backend (FR-020). Vsaka odjemalčeva zahteva odpre svojo odhodno
    povezavo — ni deljenega multipleksiranja med napravami (v nasprotju s `/snapshot`, ki
    JE predpomnjen). Nobena danes znana kamera te poti ne potrebuje; obstaja za kamere, ki
    jih uporabnik doda sam.

servers:
  - url: https://app.si/api/v1
    description: produkcija
  - url: http://localhost:3000/api/v1
    description: razvoj

tags:
  - name: cameras
    description: Seznam, dodajanje, urejanje, brisanje in vrstni red kamer
  - name: groups
    description: Skupine kamer
  - name: media
    description: Posnetki, zvezni tokovi in zdravje virov
  - name: embed-hosts
    description: Seznam dovoljenih gostiteljev za vdelavo (FR-022, research.md §6)
  - name: arso
    description: ARSO spletne kamere kot predloga pri dodajanju (FR-037)

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  # ─────────────────────────── kamere ───────────────────────────

  /cameras:
    get:
      tags: [cameras]
      operationId: listCameras
      summary: Seznam kamer (mreža in zaslon za urejanje)
      description: |
        Vrne vse kamere. Zaslon za urejanje (FR-030) prikaže tudi neaktivne; mreža
        (frontend) filtrira na `active: true` in razvrsti po `groupId`, `order` ter
        `timeOfDay` glede na lokalno uro (research.md §8). Vsak vnos vključuje izpeljano
        `health` (FR-011) — `null` za kamere brez predogleda (samostojni `iframe`/`mjpeg`/`hls`, glej
        `data-model.md`, "Izpeljano: zdravje kamere"). Zahtevani obseg: `cameras:read`.
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Seznam kamer
          content:
            application/json:
              schema:
                type: object
                required: [cameras]
                properties:
                  cameras:
                    type: array
                    items: { $ref: "#/components/schemas/Camera" }

    post:
      tags: [cameras]
      operationId: createCamera
      summary: Dodaj kamero (FR-031, Story 3)
      description: |
        Preveri naslov proti FR-034 (veljaven URL, dovoljen gostitelj za vdelavo, https ali
        obvezen proxy) preden shrani. Neveljaven vnos vrne `422` z jasnim razlogom, brez
        stranskih učinkov. Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraWrite" }
      responses:
        "201":
          description: Kamera dodana
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "422":
          description: Neveljaven ali nedovoljen naslov (FR-034)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cameras/order:
    put:
      tags: [cameras]
      operationId: reorderCameras
      summary: Spremeni vrstni red kamer (FR-035)
      description: |
        Sprejme popoln seznam ID-jev kamer znotraj ene skupine (ali brez skupine, `groupId:
        null`) v novem vrstnem redu; `order` vsake kamere se prepiše glede na položaj v
        seznamu. Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, cameraIds]
              properties:
                groupId: { type: [string, "null"] }
                cameraIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Nov vrstni red shranjen
          content:
            application/json:
              schema:
                type: object
                required: [cameras]
                properties:
                  cameras:
                    type: array
                    items: { $ref: "#/components/schemas/Camera" }

  /cameras/{cameraId}:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [cameras]
      operationId: getCamera
      summary: Preberi eno kamero (predpolnjenje obrazca za urejanje)
      description: "Zahtevani obseg: `cameras:read`."
      responses:
        "200":
          description: Kamera
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cameras]
      operationId: updateCamera
      summary: Uredi kamero (FR-032, Story 4)
      description: |
        Enaka validacija naslova kot pri dodajanju (FR-034). Ob zavrnitvi ostanejo prejšnje
        veljavne vrednosti kamere nespremenjene. Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraWrite" }
      responses:
        "200":
          description: Kamera posodobljena
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Neveljaven ali nedovoljen naslov (FR-034)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [cameras]
      operationId: deleteCamera
      summary: Izbriši kamero (FR-033, Story 4)
      description: |
        Nepovratno. Odjemalec MORA pred klicem pridobiti izrecno potrditev uporabnika
        (spec.md, Story 4 — potrditev je odjemalčeva odgovornost, endpoint sam ne vpraša
        dvakrat). Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Izbrisano }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── mediji in zdravje ───────────────────────────

  /cameras/{cameraId}/snapshot:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [media]
      operationId: getCameraSnapshot
      summary: Trenutni posnetek prek proxyja (FR-041)
      description: |
        Samo za `type: snapshot` ali `snapshot+iframe`. Predpomnjeno prek
        `platform/cache` (research.md §3) za `refreshIntervalSeconds` te kamere — ena
        kamera na več napravah ni več zahtev na vir (FR-021). Ob neuspehu vira vrne zadnji
        znani posnetek z `X-Camera-Freshness: stale`, ne napako, razen če posnetka še
        nikoli ni bilo (`503`). Zahtevani obseg: `cameras:read`.
      responses:
        "200":
          description: Slika (JPEG)
          headers:
            X-Camera-Freshness:
              schema: { type: string, enum: [fresh, refreshed, stale] }
            X-Camera-Age-Seconds:
              schema: { type: integer }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "503":
          description: Posnetka še ni bilo mogoče pridobiti (never-fetched)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cameras/{cameraId}/stream:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [media]
      operationId: getCameraStream
      summary: Zvezen tok prek proxyja (`mjpeg`/`hls`, glej omejitev zgoraj)
      description: |
        Samo za kamere, ki zahtevajo proxy (FR-020) IN so vrste `mjpeg`/`hls`. Pass-through
        brez predpomnjenja (research.md §4). Kamere, dosegljive neposredno prek `https`, to
        pot ne uporabljajo — odjemalec gre naravnost na `previewUrl`/`fullUrl`.
        Zahtevani obseg: `cameras:read`.
      responses:
        "200":
          description: Zvezen tok (multipart/x-mixed-replace za mjpeg, HLS manifest/segment za hls)
          content:
            multipart/x-mixed-replace: { schema: { type: string, format: binary } }
            application/vnd.apple.mpegurl: { schema: { type: string } }
        "502":
          description: Vir ni dosegljiv
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /cameras/{cameraId}/health:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [media]
      operationId: getCameraHealth
      summary: Zdravje vira (FR-011, FR-042, Story 5)
      description: |
        Podrobnost izpeljanega zdravja iz `data-model.md`. `null` polja pomenijo
        "iframe/mjpeg/hls, strežniško ni preverljivo" (research.md §3). Zahtevani obseg:
        `cameras:read`.
      responses:
        "200":
          description: Zdravje
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraHealth" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── skupine ───────────────────────────

  /camera-groups:
    get:
      tags: [groups]
      operationId: listCameraGroups
      summary: Seznam skupin kamer (FR-015)
      description: "Zahtevani obseg: `cameras:read`."
      responses:
        "200":
          description: Seznam
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/CameraGroup" }
    post:
      tags: [groups]
      operationId: createCameraGroup
      summary: Dodaj skupino
      description: "Zahtevani obseg: `cameras:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "201":
          description: Skupina dodana
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }

  /camera-groups/order:
    put:
      tags: [groups]
      operationId: reorderCameraGroups
      summary: Spremeni vrstni red skupin
      description: "Zahtevani obseg: `cameras:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupIds]
              properties:
                groupIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: Nov vrstni red shranjen
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/CameraGroup" }

  /camera-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [groups]
      operationId: updateCameraGroup
      summary: Uredi skupino (ime, zloženo)
      description: "Zahtevani obseg: `cameras:write`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "200":
          description: Skupina posodobljena
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [groups]
      operationId: deleteCameraGroup
      summary: Izbriši skupino
      description: |
        Kamere v izbrisani skupini se NE izbrišejo — `groupId` se postavi na `null`
        (postanejo "brez skupine"). Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Izbrisano }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── dovoljeni gostitelji ───────────────────────────

  /cameras/embed-hosts:
    get:
      tags: [embed-hosts]
      operationId: listEmbedHosts
      summary: Efektivni seznam dovoljenih gostiteljev (FR-022, research.md §6)
      description: |
        Unija osnovnega seznama iz okolja (`CAMERA_ALLOWED_EMBED_HOSTS`, `source: base`) in
        uporabniško odobrenih gostiteljev (`source: user`). Zahtevani obseg: `cameras:read`.
      responses:
        "200":
          description: Seznam
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items:
                      type: object
                      required: [host, source]
                      properties:
                        host: { type: string }
                        source: { type: string, enum: [base, user] }
    post:
      tags: [embed-hosts]
      operationId: addEmbedHost
      summary: Odobri nov gostitelj za vdelavo (Story 3, Edge Cases)
      description: |
        Izrecno dejanje uporabnika — se NE zgodi samodejno ob shranjevanju kamere z
        nedovoljenim gostiteljem. Zahtevani obseg: `cameras:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                addedReason: { type: string }
      responses:
        "201":
          description: Gostitelj dodan
          content:
            application/json:
              schema:
                type: object
                required: [host, source]
                properties:
                  host: { type: string }
                  source: { type: string, enum: [user] }

  /cameras/embed-hosts/{host}:
    delete:
      tags: [embed-hosts]
      operationId: removeEmbedHost
      summary: Odstrani uporabniško odobren gostitelj
      description: |
        Samo za gostitelje z `source: user` — osnovnega seznama iz okolja ni mogoče
        odstraniti prek API-ja (sprememba okolja, ne podatka). Zahtevani obseg:
        `cameras:write`.
      parameters:
        - name: host
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Odstranjeno }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────────── ARSO webcam predloga ───────────────────────────

  /cameras/arso-webcams:
    get:
      tags: [arso]
      operationId: listArsoWebcams
      summary: ARSO spletne kamere za lokacijo, kot predloga pri dodajanju (FR-037)
      description: |
        Bere isti predpomnjen ARSO vremenski zapis, ki ga uporablja tudi dashboard (001) —
        brez dodatnega klica ARSO (research.md §2). Prazen seznam pomeni, da ARSO za to
        lokacijo ne vrača slike; obrazec za dodajanje to prikaže kot razlog, ne kot
        napako. Zahtevani obseg: `cameras:read`.
      parameters:
        - name: location
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Seznam kandidatov
          content:
            application/json:
              schema:
                type: object
                required: [webcams]
                properties:
                  webcams:
                    type: array
                    items:
                      type: object
                      required: [direction, imageUrl]
                      properties:
                        direction: { type: string }
                        imageUrl: { type: string, format: uri }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Kratkoživ dostopni žeton (15 min) za web in Android — enako kot 001/002.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Avtentikacija za avtomatizacijo — enako kot 001/002, razširjeno z novimi obsegi za 003.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ponovljen klic z isto vrednostjo vrne prvotni rezultat. Ista vrednost z drugačnim
        telesom zahteve vrne `422` — enaka semantika kot v 001/002.
      schema:
        type: string
        maxLength: 200

  responses:
    NotFound:
      description: Ni najdeno
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details — ista oblika kot 001/002.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }

    CameraType:
      type: string
      enum: [snapshot, mjpeg, hls, iframe, "snapshot+iframe"]
      description: "FR-002. `snapshot+iframe` ni isto kot `type: iframe` — glej data-model.md."

    TimeOfDay:
      type: string
      enum: [morning, afternoon, always]
      default: always
      description: FR-004. Vpliva na vrstni red znotraj ročnega FR-014, ne nadomešča ga.

    CameraHealthState:
      type: string
      enum: [ok, stale, unreachable, unknown, "not-applicable"]
      description: |
        `not-applicable` je `iframe`/`mjpeg`/`hls` brez predpomnjenega predogleda (strežniško ni preverljivo,
        research.md §3). `unknown` je `never-fetched` — prvi zajem še ni uspel.

    CameraHealth:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/CameraHealthState" }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        ageSeconds: { type: [integer, "null"] }
        consecutiveFailures: { type: [integer, "null"] }
        lastError: { type: [string, "null"] }

    CameraBase:
      type: object
      description: |
        Skupna polja kamere. NAMENOMA brez `credentials` — to polje obstaja samo v
        `CameraWrite` (telo zahteve), nikoli v `Camera` (odgovor). Ločitev je tipska, ne le
        dogovorna: shema `Camera` spodaj deduje iz te osnove, ne iz `CameraWrite`, zato
        odgovor fizično ne more prenesti poverilnic (FR-005, glej tudi Complexity Tracking
        v plan.md — najdba analize F1).
      required: [name, type, previewUrl]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/CameraType" }
        previewUrl: { type: string, format: uri }
        fullUrl: { type: [string, "null"], format: uri }
        refreshIntervalSeconds: { type: integer, minimum: 5 }
        groupId: { type: [string, "null"] }
        timeOfDay: { $ref: "#/components/schemas/TimeOfDay" }
        active: { type: boolean, default: true }
        sourceTemplate:
          type: string
          enum: [manual, "arso-webcam"]
          default: manual

    CameraWrite:
      description: |
        Telo za `POST /cameras` in `PUT /cameras/{cameraId}`. Edina shema v tej pogodbi, ki
        vsebuje `credentials` — namenoma ločena od `Camera` (odgovor), da poverilnic ni
        mogoče vrniti niti po pomoti pri serializaciji proti tipu.
      allOf:
        - $ref: "#/components/schemas/CameraBase"
        - type: object
          properties:
            credentials:
              type: [object, "null"]
              description: Sprejeto samo v telesu zahteve; nikoli del odgovora (FR-005).
              properties:
                username: { type: string }
                password: { type: string }

    Camera:
      description: |
        Odgovor API-ja. Deduje iz `CameraBase`, NE iz `CameraWrite` — polja `credentials` v
        tej shemi ni, `hasCredentials` je edini signal (FR-005).
      allOf:
        - $ref: "#/components/schemas/CameraBase"
        - type: object
          required: [id, order, hasCredentials, createdAt, updatedAt]
          properties:
            id: { type: string }
            order: { type: integer }
            hasCredentials:
              type: boolean
              description: Ali so shranjene poverilnice — nikoli njihova vrednost (FR-005).
            health:
              oneOf:
                - $ref: "#/components/schemas/CameraHealth"
                - type: "null"
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    CameraGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        collapsed: { type: boolean, default: false }

    CameraGroup:
      allOf:
        - $ref: "#/components/schemas/CameraGroupInput"
        - type: object
          required: [id, order]
          properties:
            id: { type: string }
            order: { type: integer }
