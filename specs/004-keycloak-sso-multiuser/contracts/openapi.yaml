openapi: 3.1.0

info:
  title: CleverDash API — 004 Prijava prek Keycloaka
  version: 1.0.0
  description: |
    Pogodba funkcionalnosti 004. **V nasprotju z 002/003 (ki sta samo DODAJALI poti k 001-ovi
    pogodbi) ta datoteka NADOMESTI `/auth/*` poti, ki jih danes definira
    `specs/001-app-shell-dashboard/contracts/openapi.yaml`** — glej research.md §9. Ob
    implementaciji se te poti (in odstranjene sheme spodaj) prenesejo neposredno v 001-ovo
    datoteko; ta datoteka je referenca za `/speckit-tasks`, ne trajno vzporeden vir resnice.

    Odstranjeno iz 001-ove pogodbe (glej "Odstranjeno" spodaj): `POST /auth/login` (e-pošta +
    geslo), `POST /auth/password`, sheme `LoginRequest`, `PasswordChangeRequest`.
    `GET/DELETE /auth/sessions*` ostaneta, preimenovana z `familyId` na `sessionId`
    (data-model.md: `KeycloakSession` nadomesti `SessionFamily`).

    Vse ostale poti 001–003 (`/tabs`, `/settings`, `/dashboard/*`, `/cameras/*`,
    `/time-tracking/*`, `/devices`, `/api-keys`, `/health`) se NE SPREMENIJO po obliki — glej
    plan.md Summary: pretvorba v večuporabniško je poizvedbeni ključ v podatkovni plasti
    (`req.auth.subjectId`), ne sprememba API pogodbe.

    Glava `Idempotency-Key` NI sprejeta na `/auth/login`, `/auth/callback` in `/auth/refresh`
    (izjema za izdajo/rotacijo žetonov, člen III ustave — razširjena iz 001 na nov
    `/auth/callback`).

servers:
  - url: https://app.si/api/v1
    description: Produkcija
  - url: http://localhost:3000/api/v1
    description: Razvoj (dev-server proxy pošlje /api sem)

tags:
  - name: auth
    description: Prijava prek Keycloaka (OIDC, backend-for-frontend), seje, obseg

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /auth/login:
    get:
      tags: [auth]
      summary: Začni prijavo prek Keycloaka
      description: |
        Preusmeri brskalnik (`302`) na Keycloakov `authorization_endpoint` (Authorization
        Code + PKCE). `redirectTo` pove, kam nazaj v CleverDash preusmeriti po uspešni
        prijavi (FR-002); privzeto `/`.
      security: []
      parameters:
        - name: redirectTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Preusmeritev na Keycloak
          headers:
            Location:
              schema:
                type: string

  /auth/callback:
    get:
      tags: [auth]
      summary: Povratni klic Keycloaka (redirect_uri)
      description: |
        Izmenja avtorizacijsko kodo za žetone pri Keycloaku, ustvari/najde `User` po
        `keycloakSubject` (FR-003, FR-009), ob prvi prijavi ustvari privzete osebne
        nastavitve (research.md §11), nastavi `httpOnly` sejni piškotek in preusmeri (`302`)
        na `redirectTo` iz `/auth/login`.

        Glave `Idempotency-Key` ta pot ne sprejema — izdaja žetonov (člen III izjema).
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Prijava uspela, preusmeritev v CleverDash
        '401':
          description: |
            Koda neveljavna, ALI je uporabnik pri Keycloaku potrjen, a nima nobene
            prepoznane vloge/skupine (FR-007) — sporočilo ločeno od napačnih poverilnic.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Obnovi dostopni žeton
      description: |
        Zavrti Keycloakov `refresh_token` za trenutno sejo (data-model.md, `KeycloakSession`).
        Seja pride iz `httpOnly` piškotka — enako za web IN Android (Capacitorjev WebView
        deli piškotke z lastnimi HTTP klici; popravek med implementacijo, glej research.md
        §1: prejšnja Android-posebna pot ni več potrebna, odkar je prijava za obe platformi
        enak preusmeritveni tok).

        Glave `Idempotency-Key` ta pot ne sprejema (enako kot v 001).
      security: []
      responses:
        '200':
          description: Žeton obnovljen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            Seja neveljavna, iztekla ali preklicana pri Keycloaku (FR-005/FR-006) — vključno
            s primerom, ko je Keycloak med preverjanjem nedosegljiv (FR-007).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/logout:
    post:
      tags: [auth]
      summary: Odjava te naprave (in enotna odjava pri Keycloaku)
      description: |
        Prekliče `KeycloakSession` te naprave. Vrne Keycloakov `end_session_endpoint`
        (RP-Initiated Logout, research.md §10) — SPA MORA brskalnik preusmeriti nanj, da se
        dejansko konča tudi Keycloakova seja (FR-004); brez tega naslednji obisk dobi tiho
        ponovno prijavo prek še vedno veljavne Keycloak seje.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lokalna seja preklicana
          content:
            application/json:
              schema:
                type: object
                required: [endSessionUrl]
                properties:
                  endSessionUrl:
                    type: string
                    format: uri

  /auth/me:
    get:
      tags: [auth]
      summary: Podatki o prijavljenem računu
      responses:
        '200':
          description: Račun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions:
    get:
      tags: [auth]
      summary: Seznam aktivnih naprav
      description: Ena vrstica na `KeycloakSession` (prej `SessionFamily`) — nespremenjeno po obliki.
      responses:
        '200':
          description: Aktivne seje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Prekliči sejo izbrane naprave
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Preklicano
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Kratkoživ dostopni žeton, izdan prek Keycloaka (relay). Veljavnost se pri
        pomembnejših zahtevah preveri v živo pri Keycloaku, s kratkim TTL predpomnjenjem
        (research.md §4) — ne samo z lokalnim preverjanjem podpisa/`exp`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Nespremenjeno iz 001. Avtomatizacija (n8n) ostaja neodvisna od te spremembe (FR-019).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200

  responses:
    Unauthorized:
      description: Ni avtenticiran
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ni najdeno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457, nespremenjeno iz 001.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Veljavnost dostopnega žetona v sekundah

    Account:
      type: object
      required: [id, email, displayName, scopes]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastLoginAt:
          type: [string, "null"]
          format: date-time
      description: |
        `mustChangePassword` je ODSTRANJEN (FR-017 — ni več lokalnega gesla). Dodan
        `displayName` iz Keycloakovega `name`/`preferred_username` claima.

    DeviceSession:
      type: object
      required: [id, platform, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
        deviceLabel:
          type: string
        platform:
          type: string
          enum: [web, android]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean

    # "Odstranjeno" — dokumentirano tu zaradi sledljivosti za /speckit-tasks, NISO del te
    # pogodbe: LoginRequest, PasswordChangeRequest, SessionFamily (preimenovan v
    # DeviceSession/podprt z KeycloakSession, glej data-model.md).
