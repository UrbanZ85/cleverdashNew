openapi: 3.1.0

info:
  title: CleverDash — Zbirateljski skener
  version: 1.0.0
  description: |
    Dodatek k skenerjem (016): tip `collectibles`. Iskanja se ustvarjajo prek `/scanners` (pogodba 016)
    z `type: collectibles` in `config` po shemi `CollectiblesConfig`; rezultati prek
    `/scanners/{id}/results`, kjer `Result.data` ustreza shemi `CollectiblesResultData`. Ta pogodba doda
    samo poti za dostopnost virov in opis kategorij (iz njega Angular zgradi obrazec).

    Skrivnosti (eBay, PriceCharting) nikoli niso v odgovoru; poti vrnejo samo da/ne z razlogom.
    Vse poti zahtevajo prijavo in obseg `scanners:read`. Mutacije potekajo prek poti 016
    (z `Idempotency-Key`); ta pogodba nima mutacij.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: collectibles-scanner
    description: Viri in kategorije zbirateljskega skenerja

paths:
  /collectibles-scanner/sources:
    get:
      tags: [collectibles-scanner]
      summary: Kateri viri so vklopljeni v tej namestitvi
      description: |
        `listings` (eBay) je obvezen; brez njega zagon konča z `collectibles:no-listing-source`.
        `catalog` (TCGdex) in `prices` (PriceCharting, samo retro) sta izbirna: brez njiju so rezultati z manj
        podatki, brez vrednosti.
      operationId: getCollectiblesSources
      responses:
        '200':
          description: Viri
          content:
            application/json:
              schema:
                type: object
                required: [listings, catalog, prices, marketplaces, fake]
                properties:
                  listings: { $ref: '#/components/schemas/SourceStatus' }
                  catalog: { $ref: '#/components/schemas/SourceStatus' }
                  prices: { $ref: '#/components/schemas/SourceStatus' }
                  marketplaces:
                    type: array
                    items: { $ref: '#/components/schemas/Marketplace' }
                  fake: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /collectibles-scanner/categories:
    get:
      tags: [collectibles-scanner]
      summary: Opis kategorij (polja obrazca)
      description: |
        Vsaka kategorija opiše svoja polja (ključ, oznaka, vrsta, možnosti), tako da odjemalec obrazec
        zgradi dinamično. Dodajanje kategorije je vnos v strežniški register.
      operationId: getCollectiblesCategories
      responses:
        '200':
          description: Kategorije
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryDescriptor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Ni prijave
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Manjka obseg
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Marketplace:
      type: string
      enum: [EBAY_DE, EBAY_IT, EBAY_FR, EBAY_ES, EBAY_AT, EBAY_NL, EBAY_BE, EBAY_IE, EBAY_PL, EBAY_GB, EBAY_US]

    Category:
      type: string
      enum: [trading-cards, retro-gaming]

    SourceStatus:
      type: object
      required: [enabled, label]
      properties:
        enabled: { type: boolean }
        label: { type: string }
        reason: { type: [string, 'null'] }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }

    FieldDescriptor:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string, description: "Pot v `config`, npr. cards.gradingCompany" }
        label: { type: string, description: Slovenska oznaka }
        kind: { type: string, enum: [text, number, select, multiselect, boolean] }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        help: { type: string }

    CategoryDescriptor:
      type: object
      required: [category, label, fields]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        label: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDescriptor' }

    CollectiblesConfig:
      type: object
      required: [category]
      description: |
        `config` skenerja tipa `collectibles`. Vsaj ena od: `keywords`, filter kategorije ali `maxPrice`.
        Polja kategorije so v `cards` (trading-cards) ali `retro` (retro-gaming) — samo ustrezno.
      properties:
        category: { $ref: '#/components/schemas/Category' }
        keywords: { type: string, maxLength: 120 }
        excludedKeywords: { type: array, items: { type: string, maxLength: 40 }, maxItems: 20 }
        marketplaces:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Marketplace' }
        sellerCountries:
          type: array
          items: { type: string, pattern: '^[A-Z]{2}$' }
        minPrice: { type: number, minimum: 0 }
        maxPrice: { type: number, minimum: 0 }
        currency: { type: string, default: EUR }
        conditions:
          type: array
          items: { type: string, enum: [NEW, LIKE_NEW, USED, FOR_PARTS, UNKNOWN] }
        listingTypes:
          type: array
          minItems: 1
          items: { type: string, enum: [FIXED_PRICE, AUCTION] }
        maxShipping: { type: number, minimum: 0 }
        minDiscountPct: { type: number, minimum: 0, maximum: 100 }
        minProfit: { type: number }
        notifyMinProfit: { type: number }
        notifyMinDiscountPct: { type: number, minimum: 0, maximum: 100 }
        auctionEndingHours: { type: integer, minimum: 1, maximum: 72, default: 6 }
        cards:
          type: object
          properties:
            game: { type: string, enum: [pokemon] }
            setName: { type: string }
            cardNumber: { type: string }
            language: { type: string, enum: [en, de, fr, it, es, ja] }
            edition: { type: string, enum: [first, unlimited, shadowless, any] }
            finish: { type: string, enum: [holo, reverse, normal, any] }
            gradeStatus: { type: string, enum: [raw, graded, any] }
            gradingCompany: { type: string, enum: [PSA, BGS, CGC, SGC, any] }
            grade: { type: string }
            sealedOnly: { type: boolean }
        retro:
          type: object
          properties:
            platform: { type: string }
            consoleModel: { type: string }
            region: { type: string, enum: [PAL, NTSC-U, NTSC-J, any] }
            edition: { type: string }
            completeness: { type: string, enum: [loose, boxed, cib, sealed, any] }
            working: { type: string, enum: [working, untested, not-working, any] }
            kind: { type: string, enum: [game, console, accessory] }

    PriceBasis:
      type: string
      enum: [asking, estimate, guide, sold]
      description: |
        `asking` = zahtevana cena aktivnih oglasov; `estimate` = katalogna ocena (npr. Cardmarket
        trend v TCGdex); `guide` = cenik (PriceCharting); `sold` = preverjene prodaje. Se ne mešajo.

    Valuation:
      type: object
      required: [confidence, comparable, stale]
      properties:
        asking:
          type: [object, 'null']
          properties:
            median: { type: [number, 'null'] }
            min: { type: [number, 'null'] }
            count: { type: integer }
            currency: { type: string }
        estimate:
          type: [object, 'null']
          properties:
            value: { type: number }
            low: { type: [number, 'null'] }
            trend: { type: [number, 'null'] }
            source: { type: string }
            updatedAt: { type: [string, 'null'], format: date-time }
            currency: { type: string }
            basis: { type: string, enum: [estimate, guide] }
        sold:
          type: [object, 'null']
          properties:
            average: { type: number }
            median: { type: [number, 'null'] }
            count: { type: integer }
            periodMonths: { type: integer }
            source: { type: string }
            currency: { type: string }
        primary: { type: [string, 'null'], enum: [sold, guide, estimate, null] }
        confidence: { type: string, enum: [high, medium, low, insufficient] }
        comparable: { type: boolean }
        stale: { type: boolean }
        note: { type: [string, 'null'] }

    Identification:
      type: object
      required: [kind, confidence, reason, needsReview]
      properties:
        kind: { type: string }
        confidence: { type: string, enum: [high, medium, low, none] }
        reason: { type: string, description: Slovensko, kratko }
        needsReview: { type: boolean }
        variantKey: { type: [string, 'null'] }
        catalog:
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
            setName: { type: [string, 'null'] }
            number: { type: [string, 'null'] }
            rarity: { type: [string, 'null'] }
            imageUrl: { type: [string, 'null'] }

    Opportunity:
      type: object
      required: [illustrative, price, missing]
      properties:
        illustrative: { type: boolean, const: true }
        price: { type: number }
        shipping: { type: [number, 'null'] }
        taxes: { type: [number, 'null'] }
        buyerFees: { type: number }
        acquisitionCost: { type: [number, 'null'] }
        conservativeValue: { type: [number, 'null'] }
        sellingFees: { type: [number, 'null'] }
        riskReserve: { type: [number, 'null'] }
        profit: { type: [number, 'null'] }
        roi: { type: [number, 'null'] }
        discountPct: { type: [number, 'null'] }
        discountBasis: { type: [string, 'null'], enum: [sold, guide, estimate, null] }
        profitBasis: { type: [string, 'null'], enum: [sold, null] }
        score: { type: [number, 'null'] }
        missing:
          type: array
          items: { type: string }

    CollectiblesResultData:
      type: object
      description: "`Result.data` za tip `collectibles`."
      required: [collectible, listing, identification, opportunity]
      properties:
        collectible:
          type: object
          required: [category]
          additionalProperties: true
        listing:
          type: object
          required: [marketplace, itemId, listingType, shippingKnown, images]
          properties:
            marketplace: { $ref: '#/components/schemas/Marketplace' }
            itemId: { type: string }
            listingType: { type: string, enum: [FIXED_PRICE, AUCTION] }
            endsAt: { type: [string, 'null'], format: date-time }
            bidCount: { type: [integer, 'null'] }
            shipping: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            shippingKnown: { type: boolean }
            images:
              type: array
              items: { type: string, format: uri }
        identification: { $ref: '#/components/schemas/Identification' }
        valuation:
          oneOf:
            - $ref: '#/components/schemas/Valuation'
            - type: 'null'
        opportunity: { $ref: '#/components/schemas/Opportunity' }
        alerts:
          type: object
          properties:
            profitNotified: { type: boolean }
            discountNotified: { type: boolean }
            auctionEndingNotified: { type: boolean }
