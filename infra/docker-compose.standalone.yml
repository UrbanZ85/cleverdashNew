# Dodatek za postavitev BREZ skupnega proxyja pred sabo — takrat mora ta Caddy sam držati
# 80/443 in sam skrbeti za TLS. Uporabi ga skupaj z glavno datoteko:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.standalone.yml up -d
#
# Ob tem v datoteki z okoljem nastavi CADDY_SITE_ADDRESS na isto vrednost kot
# PUBLIC_BASE_URL (npr. https://cleverdash.zuusi.com), sicer Caddy posluša samo na :80 brez
# TLS. V Caddyfile takrat odstrani vrstico `header_up X-Forwarded-For` (glej pojasnilo tam).
services:
  caddy:
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
