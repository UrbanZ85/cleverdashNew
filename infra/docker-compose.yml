services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-cleverdash}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD manjka}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      TZ: Europe/Ljubljana
      # Pot do brskalnika je lastnost SLIKE, ne operaterjevega računalnika. `env_file` povozi
      # `ENV` iz Dockerfila, zato bi razvijalčev `.env` (kjer mora pot kazati na Chrome na
      # Windowsu/macOS) sicer pokvaril vsebnik. Tu nastavljena vrednost povozi `env_file`.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      mongo:
        condition: service_healthy
    # 002, research.md §2: Chromium v Dockerju brez te trojice ni zanesljiv.
    # - shm_size: privzeti /dev/shm (64 MB) povzroči "Target closed" ob nalaganju strani.
    # - init: Chromium pušča zombi procese; brez pravega PID 1 se prostor PID-jev zapolni.
    # - mem_limit: Chromium raste; brez omejitve lahko izstrada Mongo na istem VPS-u.
    shm_size: '1gb'
    init: true
    mem_limit: 1500m
    volumes:
      - ${FCM_KEY_FILE}:/run/secrets/fcm_key:ro
      - screenshots:/app/data/screenshots
      # 009: vsebina deljenih datotek NI v bazi (500 MB presega dokument Monga), ampak tu.
      # Brez tega nosilca naložene datoteke izginejo ob prvi posodobitvi slike — modul bi
      # obljubljal, česar ne more držati (kakovostna vrata, točka 4). `tmp/` in `blobs/`
      # nastaneta pod to potjo in MORATA biti na istem nosilcu, sicer objava datoteke ni
      # atomarno preimenovanje, ampak kopiranje (specs/009-file-sharing/research.md §5).
      - shared-files:/app/data/files
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Ni dolgo živečega "web" strežnika: Caddy sam streže statični build (glej Caddyfile,
  # `root * /srv/www`). Ta storitev samo zgradi Angular SPA in kopira izhod v deljen
  # volumen, nato se izteče — `restart: "no"` je namerno.
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: "no"
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - web-dist:/out

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env
    ports:
      # Nastavljivo prek .env za lokalno preverjanje, kadar je 80/443 na gostitelju že
      # zaseden (glej quickstart.md §2) — v produkciji nastavljeni privzetki zadoščajo.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  screenshots:
  shared-files:
  web-dist:
  caddy-data:
  caddy-config:
