# Produkcijska kompozicija (VPS). Datoteka z okoljem NI v repozitoriju (člen IV): živi ob
# njem, privzeto `../envs/.env.cleverdashNew` gledano iz korena repozitorija — mapa `envs/`
# je torej sestra korena. Poti spodaj so relativne na TO mapo (`infra/`), zato je v njih ena
# raven več.
#
# Compose isto datoteko potrebuje na DVA načina in oba morata biti nastavljena:
#   `env_file:`   → vrednosti dobijo PROCESI v vsebnikih (api, caddy)
#   `--env-file`  → vrednosti, ki jih compose vstavi v to YAML datoteko samo
#                   (${FCM_KEY_FILE}, ${PLANEGO_NETWORK} ...)
# Ker je nanju lahko pozabiti in je izpad drugega tih, `docker compose` na produkciji ne
# kliči neposredno, ampak prek `scripts/vps-compose.sh`, ki nastavi oba.
#
# Ta sklad NIMA svojega Monga. Na VPS-u eden že teče (vsebnik `mongo` iz sklada planego) in
# uporabljamo tistega: api se priključi na njegovo omrežje `planego-network`, povezovalni
# niz pa je v MONGO_URI. Baza je kljub skupnemu strežniku SVOJA (`cleverdash`) — CleverDash
# ima zbirke `users`, `settings`, `notes` ..., ki se z planegovimi imensko prekrivajo, in v
# isti bazi bi se podatki obeh aplikacij pomešali.
name: cleverdash

# Ena sama navedba poti do datoteke z okoljem za vse storitve. `ENV_FILE` nastavi
# scripts/vps-compose.sh (absolutna pot, zato je vseeno, iz katere mape kličeš); privzetek
# velja, kadar kdo požene `docker compose` na roko iz te mape.
x-env-file: &env-file
  - ${ENV_FILE:-../../envs/.env.cleverdashNew}

services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file: *env-file
    # Dve omrežji, obe zunanji in obe nujni:
    #   `web`             → omrežje skupnega Caddyja (/opt/caddy). Brez njega ta ne more
    #                       doseči vsebnika po imenu `cleverdash-api-1`.
    #   `planego-network` → omrežje obstoječega Monga. Brez njega se ime `mongo` iz
    #                       MONGO_URI ne razreši in api se ne poveže z bazo.
    # Privzetega omrežja tega sklada (`default`) storitev ne potrebuje: odkar Monga ni več
    # tu, v skladu ni ničesar, s čimer bi se api pogovarjal.
    networks:
      - web
      - planego-network
    # Brez tega prijava ne deluje, čeprav Keycloak povsem normalno teče (izmerjeno na
    # produkciji: z gostitelja `curl https://kc.planego.eu/...` vrne 200, iz TEGA vsebnika
    # pa `connect ECONNREFUSED 172.18.0.6:443`).
    #
    # Vzrok je Dockerjev vgrajeni DNS: na skupnem omrežju `web`/`planego-network` neki
    # vsebnik nosi ime `kc.planego.eu` kot omrežni vzdevek, zato se to ime tu razreši v
    # njegov notranji naslov namesto v javni — tam pa 443 ne posluša nihče (Keycloak sam
    # posluša na 8080, TLS zanj opravi Caddy). Brskalnika to ne prizadene, ker ime razreši
    # javno, zato prijavna stran izgleda v redu; pade vse, kar kliče strežnik sam
    # (discovery, zamenjava kode, introspekcija) — glej KeycloakUnreachableError v
    # apps/api/src/platform/keycloak/client.ts.
    #
    # `host-gateway` je naslov gostitelja, na katerem skupni Caddy drži 443 in za
    # `kc.planego.eu` že ima pravi certifikat. Vpis pristane v `/etc/hosts` vsebnika, ta pa
    # ima pri razreševanju prednost pred Dockerjevim DNS-om, zato vzdevek prebije.
    #
    # Zavestno NE popravljamo vzdevka pri viru: ta je v planegovem skladu in bi za njegov
    # popravek morali vsebnik postaviti na novo, s čimer bi padla kc.planego.eu in planego.
    # Prav tako NE gremo na Keycloak po notranjem `http://`: naslov izdajatelja se mora
    # ujemati z `KEYCLOAK_ISSUER_URL` do črke, sicer žetoni niso veljavni.
    extra_hosts:
      - "kc.planego.eu:host-gateway"
    environment:
      TZ: Europe/Ljubljana
      # Vrata so lastnost POSTAVITVE, ne operaterjeve datoteke z okoljem: nanje sta vezana
      # `reverse_proxy cleverdash-api-1:3010` v infra/cleverdash.caddyfile in preverjanje
      # zdravja spodaj. Zato so pripeta tukaj (compose `environment` povozi `env_file`) —
      # sprememba PORT v .env bi sicer tiho podrla proxy. 3010 in ne 3000/3002, ker sta ta
      # dva na tem VPS-u že v rabi; navzven ta vrata niso objavljena, do njih pride le
      # Caddy po omrežju `web`.
      PORT: "3010"
      # Node velikost kopice izbere iz pomnilnika, ki ga zazna, in cgroup omejitve ne
      # upošteva zanesljivo — na 4 GB gostitelju bi si privzeto dovolil kopico, večjo od
      # `mem_limit` spodaj, in vsebnik bi ubilo jedro (137), preden bi V8 začel resno
      # pospravljati. 512 MB je nad vsem, kar ta proces potrebuje (največje telo v
      # pomnilniku je 10 MB posnetek; 500 MB datoteke gredo po toku, glej
      # modules/file-sharing/services/upload.service.ts), in pusti prostor Chromiumu v
      # istem vsebniku.
      NODE_OPTIONS: --max-old-space-size=512
      # Pot do brskalnika je lastnost SLIKE, ne operaterjevega računalnika. `env_file` povozi
      # `ENV` iz Dockerfila, zato bi razvijalčev `.env` (kjer mora pot kazati na Chrome na
      # Windowsu/macOS) sicer pokvaril vsebnik. Tu nastavljena vrednost povozi `env_file`.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    # `depends_on: mongo` tu ne more biti — vsebnik z bazo ni del tega sklada. Če Mongo ob
    # zagonu ni dosegljiv, api pade in ga `restart: unless-stopped` poskuša znova.

    # 002, research.md §2: Chromium v Dockerju brez te trojice ni zanesljiv. Številki sta
    # umerjeni na VPS s 4 GB, kjer poleg tega vsebnika tečejo še skupni Mongo, Keycloak,
    # planego in Caddy.
    # - shm_size: privzeti /dev/shm (64 MB) povzroči "Target closed" ob nalaganju strani.
    #   512 MB je 8× toliko in za eno stran naenkrat z veliko rezervo dovolj. To je zgornja
    #   meja tmpfs-a, ne rezervacija — a kar Chromium tja zapiše, se šteje v `mem_limit`,
    #   zato prostor ni zastonj: pri prejšnjem 1 GB bi polna /dev/shm sama presegla mejo in
    #   jedro bi ubilo cel vsebnik, ne le brskalnika.
    # - init: Chromium pušča zombi procese; brez pravega PID 1 se prostor PID-jev zapolni.
    # - mem_limit: Chromium raste; brez omejitve lahko izstrada Mongo na istem VPS-u.
    #   Ustaljena poraba je ~700-900 MB (Node ~200 MB, dolgo živeč Chromium 250-500 MB,
    #   /dev/shm nekaj deset MB), zato 1200m: dovolj rezerve za odprto stran, hkrati pa
    #   vsebnik ne more sam pojesti tretjine gostitelja. Meja je varovalka pred uhajanjem,
    #   ne rezervacija — dokler poraba ne naraste, gostitelj tega pomnilnika ne izgubi.
    shm_size: '512m'
    init: true
    mem_limit: 1200m
    volumes:
      # Ključ za potisna obvestila (Google service account JSON za FCM). Prazna vrednost je
      # sintaktična napaka compose datoteke ("empty section between colons"), zato privzetek:
      # /dev/null pomeni "ključa ni". Sklad se v tem primeru normalno zažene, samo `sendPush`
      # ob prvem pošiljanju vrne neuspeh z zabeleženo kodo — napako ob inicializaciji lovi
      # isti `try` (platform/notifications/fcm.service.ts). Potisna obvestila torej ne
      # delujejo, vse ostalo pa da.
      - ${FCM_KEY_FILE:-/dev/null}:/run/secrets/fcm_key:ro
      - screenshots:/app/data/screenshots
      # 009: vsebina deljenih datotek NI v bazi (500 MB presega dokument Monga), ampak tu.
      # Brez tega nosilca naložene datoteke izginejo ob prvi posodobitvi slike — modul bi
      # obljubljal, česar ne more držati (kakovostna vrata, točka 4). `tmp/` in `blobs/`
      # nastaneta pod to potjo in MORATA biti na istem nosilcu, sicer objava datoteke ni
      # atomarno preimenovanje, ampak kopiranje (specs/009-file-sharing/research.md §5).
      - shared-files:/app/data/files
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Ni dolgo živečega "web" strežnika: statični build streže skupni Caddy (/opt/caddy).
  # Ta storitev samo zgradi Angular SPA, kopira izhod in se izteče — `restart: "no"` je
  # namerno.
  #
  # Zakaj piše v Caddyjev nosilec `caddy_caddy_data`: skupni Caddy ima iz tega sklada
  # montirano SAMO to (in /config), Caddyfile pa kot posamezno datoteko. Nov nosilec bi
  # mu lahko dodali le tako, da vsebnik postavimo na novo, s čimer bi za nekaj časa padla
  # tudi kc.planego.eu in planego-*. Pisanje v obstoječi nosilec je zato edina pot, ki se
  # njegovega vsebnika ne dotakne. Zapisujemo izključno v podmapo `cleverdash-www/`;
  # Caddyjevi certifikati živijo pod `/data/caddy/` in se jih to ne dotakne.
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: "no"
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - caddy_caddy_data:/out

networks:
  # Skupno omrežje, na katerem že živijo planego-* in skupni Caddy. Ustvarjeno je zunaj
  # tega sklada (`docker network create web`), zato `external` — ta sklad ga ne sme
  # lastniti in ga ob `down` ne sme pobrisati.
  web:
    external: true

  # Omrežje obstoječega Monga (sklad planego; `driver: bridge` z
  # `com.docker.network.driver.mtu: "1450"`). Tudi to je `external`, in to je bistveno:
  # ime `mongo` razreši samo TISTO omrežje, na katerem vsebnik z bazo že teče. Če bi ga tu
  # definirali z `driver`/`driver_opts`, bi compose ustvaril NOVO, prazno omrežje
  # `cleverdash_planego-network`; sklad bi se zagnal, `mongo` se ne bi razrešil, okvara pa
  # bi se pokazala šele ob prvem klicu baze. Pri `external` napačno ime compose zavrne
  # glasno ("network ... declared as external, but could not be found").
  #
  # Če se omrežje na strežniku imenuje drugače (compose ga po projektu pogosto poimenuje
  # `planego_planego-network` — preveri z `docker network ls`), nastavi PLANEGO_NETWORK v
  # datoteki z okoljem; privzetek je golo `planego-network`.
  planego-network:
    external: true
    name: ${PLANEGO_NETWORK:-planego-network}

volumes:
  screenshots:
  shared-files:
  # Nosilec SKUPNEGA Caddyja (projekt `caddy`, glej `docker volume ls`), ki ga ta že ima
  # montiran na /data. Sem `web` odloži build; skupni Caddy ga vidi kot
  # /data/cleverdash-www. `external`, ker ni naš — ob `down -v` ga ne smemo pobrisati.
  caddy_caddy_data:
    external: true
