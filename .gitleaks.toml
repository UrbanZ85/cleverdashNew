# Vrata 5 ustave: noben niz, ki je videti kot skrivnost, ni v gitu.
# Zaganja se v CI (.github/workflows/ci.yml) in ob poljubnem trenutku lokalno:
#   gitleaks detect --config .gitleaks.toml --source . --no-git -v
#   gitleaks detect --config .gitleaks.toml --source . -v   (nad celotno zgodovino)

title = "cleverdash gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Namerno prazne vrednosti, dokumentacijski primeri in sintetična testna gesla"
paths = [
  '''\.env\.example$''',
  '''docs/env-reference\.md$''',
  '''docs/SECURITY-FIRST\.md$''',
]
# Ti dve gesli sta izmišljeni, deterministični testni vrednosti iz
# apps/api/tests/setup/test-env.ts — uporabljeni izključno proti v-pomnilniški testni bazi
# (mongodb-memory-server), nikoli proti pravemu sistemu. Niso skrivnost; so vhodni podatek
# testa, ki mora biti stalen, da so testi ponovljivi. Preverjeno z `gitleaks detect` po
# `npm test` na T135 — brez tega vnosa vsak test, ki uvozi test-env.ts, sproži lažno pozitiven
# zadetek "generic-api-key".
regexes = [
  '''zacetno-geslo-12''',
  '''novo-mocno-geslo-123''',
]
