name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Detektor skrivnosti (vrata 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  contract:
    name: Validacija OpenAPI pogodbe (vrata 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint specs/001-app-shell-dashboard/contracts/openapi.yaml

  build:
    name: Typecheck, lint, test (vrata 1)
    runs-on: ubuntu-latest
    needs: [secrets, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
